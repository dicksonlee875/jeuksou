# Runs the scraper every 3 days and saves the new codes and the rebuilt page.
# Cloudflare Pages watches this repository and publishes public/ after each save.
name: Update Jeuksou

on:
  schedule:
    - cron: "0 1 */3 * *"   # 09:00 Hong Kong time, every 3 days
  workflow_dispatch:         # adds a "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape promo pages
        run: python scraper.py
      - name: Build wallet page
        run: python build.py
      - name: Save codes and page
        run: |
          git config user.name "jeuksou-bot"
          git config user.email "jeuksou-bot@users.noreply.github.com"
          git add data/deals.json public
          git diff --cached --quiet || git commit -m "Update codes $(date -u +%F)"
          git push
