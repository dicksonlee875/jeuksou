<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f6">
<title>Jeuksou 著數碼</title>
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Jeuksou">
<script>
// Pick light or dark before the page paints: the Settings choice, else the phone's setting.
(function () { var t = null; try { t = JSON.parse(localStorage.getItem("zsm-theme")); } catch (e) {}
  if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
  if (t === "dark") document.querySelector('meta[name="theme-color"]').content = "#0b0d12"; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@600&family=Noto+Sans+HK:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first wallet app in one centred column. Region switch, category tabs, then the colourful stacked site cards that open in place. Floating tab bar for Wallet / Saved / Settings. Light by default, dark via Settings or the system setting. */
:root {
  color-scheme: light;
  --bg: #f2f3f6;
  --panel: #ffffff;
  --panel-2: #f2f3f6;
  --well: #e3e5eb;
  --line: #dadde4;
  --ink: #0e1116;
  --ink-2: #2a2f38;
  --muted: #5b6270;
  --accent: #2b59ff;
  --accent-ink: #ffffff;
  --code-bg: #ffffff;
  --ok: #0a7d4f; --ok-bg: rgba(10,125,79,.1);
  --warn: #9a5b00; --warn-bg: rgba(229,145,0,.14);
  --bad: #c0282d; --bad-bg: rgba(192,40,45,.1);
  --info: #2347d6; --info-bg: rgba(43,89,255,.1);
  --soft: rgba(14,17,22,.06);
  --card-shadow: 0 -6px 18px rgba(14,17,22,.18);
  --bar: #0e1116; --bar-ink: #b9bfcc; --bar-on: #ffffff; --bar-on-ink: #0e1116;
  --toast: #0e1116; --toast-ink: #ffffff;
  --font: "Manrope", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --hk: "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0d12; --panel: #171a21; --panel-2: #20242d; --well: #20242d; --line: #2c313b;
  --ink: #f1f3f7; --ink-2: #d6dae2; --muted: #9aa1ae; --accent: #6b8cff; --accent-ink: #0b0d12; --code-bg: #0b0d12;
  --ok: #4fd69c; --ok-bg: rgba(79,214,156,.13); --warn: #ffc85c; --warn-bg: rgba(255,200,92,.13);
  --bad: #ff8a80; --bad-bg: rgba(255,138,128,.13); --info: #a9bcff; --info-bg: rgba(107,140,255,.16);
  --soft: rgba(255,255,255,.07); --card-shadow: 0 -8px 24px rgba(0,0,0,.45);
  --bar: #f1f3f7; --bar-ink: #5b6270; --bar-on: #0b0d12; --bar-on-ink: #ffffff;
  --toast: #f1f3f7; --toast-ink: #0e1116;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 680px; margin: 0 auto; padding-block: 18px calc(110px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- header ---------- */
.hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo .mark { width: 40px; height: 40px; border-radius: 11px; flex: none; }
.logo b { display: block; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.logo span { display: block; font: 700 12px var(--hk); color: var(--muted); letter-spacing: .08em; }
.region-btn { display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 12px 0 13px; border: 0; border-radius: 999px; background: var(--panel); color: var(--ink); font-size: 14.5px; font-weight: 700; cursor: pointer; box-shadow: 0 1px 2px rgba(14,17,22,.08); }
.region-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.region-btn .chev-d { width: 15px; height: 15px; stroke-width: 2.6; color: var(--muted); }

/* ---------- region picker sheet ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(14,17,22,.45); animation: fadein .2s ease-out; }
.sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; transform: translateX(-50%); width: min(680px, 100%); max-height: 86vh; overflow-y: auto; background: var(--panel); border-radius: 24px 24px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); animation: up .25s ease-out; }
.grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line); margin: 4px auto 12px; }
.sheet h2 { margin: 0 4px 10px; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.reg-h { margin: 14px 4px 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.reg { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 12px; border: 0; border-radius: 14px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.reg:hover { background: var(--panel-2); }
.reg .rn { flex: 1; font-size: 16px; font-weight: 700; }
.reg small { color: var(--muted); font-size: 13px; font-weight: 600; }
.reg svg { width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
.reg[aria-pressed="true"] { background: var(--info-bg); }
.reg[aria-pressed="true"] svg { visibility: visible; }
@keyframes up { from { transform: translate(-50%, 100%); } }
@keyframes fadein { from { opacity: 0; } }

/* ---------- best right now ---------- */
.hero { margin-top: 16px; background: #2b59ff; color: #fff; border-radius: 20px; padding: 16px 18px 18px; display: grid; gap: 10px; }
.hero-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 700; opacity: .92; }
.hero-big { font-size: clamp(36px, 10vw, 44px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.hero-row { display: flex; gap: 8px; }
.hero-code { flex: 1; min-width: 0; height: 46px; border-radius: 12px; background: rgba(255,255,255,.18); display: flex; align-items: center; padding: 0 14px; font: 600 15px var(--mono); letter-spacing: .06em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-copy { height: 46px; padding: 0 20px; border: 0; border-radius: 12px; background: #fff; color: #2b59ff; font-weight: 800; font-size: 14.5px; cursor: pointer; }

:root[data-theme="dark"] .lang button[aria-pressed="true"] { background: #454c5c; }

/* ---------- search, region, categories ---------- */
.tools { margin-top: 16px; display: grid; gap: 12px; }
.field { position: relative; min-width: 0; }
.field input { width: 100%; height: 50px; padding: 0 14px 0 44px; border: 1px solid transparent; border-radius: 14px; background: var(--panel); transition: border-color .15s, box-shadow .15s; }
.field input::placeholder { color: var(--muted); }
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--info-bg); }
.field .ico { position: absolute; left: 15px; top: 16px; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.tabs-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.tabs-wrap::-webkit-scrollbar { display: none; }
.tabs { display: flex; gap: 20px; width: max-content; }
.tab { border: 0; background: transparent; padding: 10px 0 12px; font-size: 14.5px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab .n { margin-left: 4px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tab[aria-pressed="true"] { color: var(--ink); font-weight: 800; box-shadow: inset 0 -2.5px 0 var(--accent); }
.sub-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
.toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 26px 2px 10px; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.sec-h:first-child { margin-top: 0; }
.sec-h span { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: 0; }
.sec-h + .wcard { margin-top: 0; }
.wcard:has(+ .sec-h) .wcard-h { padding-bottom: 18px; }

/* ---------- wallet stack (the colourful cards) ---------- */
.stack { margin-top: 16px; display: flex; flex-direction: column; }
.wcard { position: relative; border-radius: 20px; margin-top: -26px; box-shadow: var(--card-shadow); overflow: hidden; transition: margin .25s ease; }
.wcard:first-child { margin-top: 0; }
.wcard.open { margin-top: 14px; margin-bottom: 14px; }
.wcard:first-child.open { margin-top: 0; }
.wcard-h { width: 100%; border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer; padding: 18px 18px 34px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; }
.wcard.open .wcard-h, .wcard:last-child .wcard-h { padding-bottom: 18px; }
.wcard-name { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
.wcard-rank { font: 600 13px var(--mono); opacity: .75; margin-right: 8px; font-variant-numeric: tabular-nums; }
.wcard-cats { font-size: 13px; opacity: .85; grid-column: 1; }
.wcard-right { grid-row: 1 / span 2; grid-column: 2; text-align: right; }
.wcard-best { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.wcard-count { font-size: 12.5px; font-weight: 700; opacity: .85; }
.wcard-body { background: var(--panel); color: var(--ink); padding: 6px 12px 12px; display: grid; gap: 10px; }
.site-tip { font-size: 13.5px; color: var(--ink-2); background: var(--panel-2); border-radius: 12px; padding: 11px 13px; }
.site-tip b { color: var(--ink); }

/* ---------- deal rows ---------- */
.deal { background: var(--panel-2); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.deal-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; }
.deal-big { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.deal-title { font-weight: 700; font-size: 15px; grid-column: 1; }
.tags { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.tag { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.t-active { background: var(--ok-bg); color: var(--ok); }
.t-restricted { background: var(--info-bg); color: var(--info); }
.t-unconfirmed, .t-soon { background: var(--warn-bg); color: var(--warn); }
.t-expired, .t-avoid { background: var(--bad-bg); color: var(--bad); }
.t-offer, .t-auto { background: var(--soft); color: var(--ink-2); }
.desc { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.cond { margin: 0; color: var(--muted); font-size: 13.5px; }
.codes { display: flex; flex-wrap: wrap; gap: 8px; }
.code { display: inline-flex; align-items: center; gap: 10px; font: 600 15px var(--mono); letter-spacing: .05em; padding: 7px 7px 7px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--code-bg); color: var(--ink); cursor: pointer; transition: border-color .15s, transform .05s; }
.code:hover { border-color: var(--accent); }
.code:active { transform: scale(.98); }
.code .cp { font: 700 11.5px var(--font); letter-spacing: 0; background: var(--ink); color: var(--bg); padding: 3px 9px; border-radius: 6px; }
.code.done .cp { background: var(--ok); color: #fff; }
.dead .code { color: var(--muted); text-decoration: line-through; cursor: default; }
.dead .code .cp { display: none; }
.dead .deal-big { color: var(--muted); }
.offer-link { display: inline-flex; align-items: center; gap: 6px; width: max-content; font-weight: 700; font-size: 14px; color: var(--ink); text-decoration: none; background: var(--code-bg); border: 1px solid var(--line); padding: 8px 13px; border-radius: 10px; }
.offer-link:hover { border-color: var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta a { color: var(--muted); }
.mine { display: inline-flex; gap: 6px; margin-left: auto; }
.mine button { font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 4px 10px; border-radius: 8px; cursor: pointer; }
.mine button[aria-pressed="true"].yes { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.mine button[aria-pressed="true"].no { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.dead-h { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 4px 0; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; }
.section-h { margin: 22px 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.saved-list { display: grid; gap: 10px; }
.saved-list .deal { background: var(--panel); }
.saved-site { font-size: 12.5px; font-weight: 800; color: var(--site, var(--accent)); }

.view-h { margin: 8px 0 6px; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
.view-p { margin: 0 0 16px; color: var(--muted); }

/* ---------- settings ---------- */
.group { background: var(--panel); border-radius: 20px; margin-top: 16px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; width: 100%; border: 0; background: transparent; color: var(--ink); text-align: left; font-size: 15.5px; font-weight: 700; }
button.row { cursor: pointer; }
.row + .row { box-shadow: inset 60px 1px 0 -59px transparent; border-top: 1px solid var(--line); }
.row .ri { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; color: #fff; }
.row .ri svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.row .rl { flex: 1; min-width: 0; }
.row .rv { color: var(--muted); font-weight: 600; font-size: 14px; text-align: right; }
.row .chev { width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 2.4; flex: none; }
.lang { display: inline-flex; background: var(--well); border-radius: 10px; padding: 3px; }
.lang button { border: 0; background: transparent; color: var(--ink-2); font-size: 13.5px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(14,17,22,.14); }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--well); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: #34c77b; }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.set-note { margin: 14px 4px 0; font-size: 12.5px; color: var(--muted); }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--accent); font-weight: 700; font-size: 15px; padding: 8px 0; cursor: pointer; }
.back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; }
.legal { background: var(--panel); border-radius: 20px; padding: 6px 18px 18px; margin-top: 12px; }
.legal h3 { margin: 16px 0 4px; font-size: 15.5px; font-weight: 800; }
.legal p { margin: 0; color: var(--ink-2); font-size: 14.5px; }

/* ---------- floating tab bar ---------- */
.tabbar { position: fixed; z-index: 25; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--bar); border-radius: 999px; padding: 7px; display: flex; gap: 4px; box-shadow: 0 10px 30px rgba(14,17,22,.28); }
.tabbar button { position: relative; border: 0; background: transparent; color: var(--bar-ink); width: 68px; height: 46px; border-radius: 999px; display: grid; place-items: center; cursor: pointer; }
.tabbar svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-selected="true"] { background: var(--bar-on); color: var(--bar-on-ink); }
.tabbar .badge { position: absolute; top: 4px; right: 12px; min-width: 17px; height: 17px; font-size: 10.5px; font-weight: 800; line-height: 17px; background: #ff4d4f; color: #fff; border-radius: 999px; padding: 0 5px; }

/* ---------- toasts ---------- */
.toasts { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(380px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--toast); color: var(--toast-ink); box-shadow: 0 10px 30px rgba(0,0,0,.3); font-size: 14px; font-weight: 600; animation: slide .25s ease-out; }
.toast svg { flex: none; width: 19px; height: 19px; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.toast.ok svg { stroke: #34c77b; } .toast.warn svg { stroke: #e59100; } .toast.bad svg { stroke: #ff4d4f; }
.toast.out { animation: fade .2s ease-in forwards; }
@keyframes slide { from { opacity: 0; transform: translateY(10px); } }
@keyframes fade { to { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { .toast, .toast.out, .sheet, .sheet-bg { animation: none; } .wcard, .switch span, .switch span::after { transition: none; } }

@media (min-width: 720px) {
  .app { padding-top: 32px; }
  .wcard-h { padding: 20px 22px 36px; }
  .wcard-name { font-size: 21px; }
  .wcard-body { padding: 8px 16px 16px; }
}
html[lang^="zh"] body { font-family: var(--font), var(--hk); }
html[lang="zh-Hans"] body { font-family: var(--font), "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="logo"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d97ff"/><stop offset=".55" stop-color="#3a5bf0"/><stop offset="1" stop-color="#2337b8"/></linearGradient></defs><rect width="100" height="100" fill="#121218"/><g transform="translate(5 5) scale(.9)"><rect x="18" y="20" width="64" height="40" rx="8" fill="#ff7a1a"/><rect x="18" y="32" width="64" height="40" rx="8" fill="#e0314b"/><rect x="18" y="44" width="64" height="40" rx="8" fill="url(#lg)"/><text x="32" y="74" font-family="Noto Sans HK, sans-serif" font-weight="900" font-size="22" fill="#fff">著</text><rect x="58" y="62" width="16" height="6" rx="3" fill="#fff" fill-opacity=".85"/></g></svg><div><b>Jeuksou</b><span>著數碼</span></div></div>
    <button class="region-btn" id="regionBtn" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span id="regionName"></span><svg class="chev-d" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  </header>

  <!-- ===== WALLET ===== -->
  <section id="view-wallet">
    <div class="hero" id="hero" hidden></div>
    <div class="tools">
      <div class="field">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" data-ph="search">

<script>
// Filled in by build.py from data/deals.json.
const DATA = {"updated":"2026-10-27","categories":["Flights","Hotels","Car rental","Travel extras","Activities","Shopping","Food & rides"],"sites":{"trip":{"name":"Trip.com","checked":"2026-10-27","note":"Most codes are tied to a payment card or region and are first come, first served. Hong Kong amounts are in HK$. Paste the code on the payment page.","color":["#2f6bff","#1c46d6"],"note_zh":"大部分優惠碼與付款卡或地區掛鈎，先到先得。香港金額以港幣計。在付款頁貼上優惠碼。","cats":["Car rental","Flights","Hotels","Activities","Travel extras"],"note_sc":"大部分优惠码与付款卡或地区挂钩，先到先得。香港金额以港币计。在付款页贴上优惠码。"},"sbc":{"name":"Sicily by Car","checked":"2026-10-27","note":"No open public promo right now. Every valid code is for a group, and the counter asks for proof at pickup. Without it they charge full price or can refuse the car. You need a credit card in the driver's name. A Black Friday code usually appears in late November.","color":["#d97706","#a85a03"],"note_zh":"現時沒有公開優惠。所有有效優惠碼都屬特定團體，取車時櫃枱會要求證明，否則會收原價或拒絕租車。須有主司機名下的信用卡。黑色星期五優惠碼通常在 11 月下旬推出。","cats":["Car rental"],"note_sc":"现时没有公开优惠。所有有效优惠码都属特定团体，取车时柜台会要求证明，否则会收原价或拒绝租车。须有主司机名下的信用卡。黑色星期五优惠码通常在 11 月下旬推出。"},"europcar":{"name":"Europcar","checked":"2026-10-27","note":"Current discounts are built-in offers: book through the offer page, no code to type. The two Italy offers can't be stacked, so compare both for your dates. You need a credit card in the main driver's name.","color":["#16a34a","#0f7a37"],"note_zh":"現時的折扣都是內置優惠：經優惠頁預訂，不用輸入優惠碼。兩個意大利優惠不能疊加，按你的日期比較兩者。須有主司機名下的信用卡。","cats":["Car rental"],"note_sc":"现时的折扣都是内置优惠：经优惠页预订，不用输入优惠码。两个意大利优惠不能叠加，按你的日期比较两者。须有主司机名下的信用卡。"},"klook":{"name":"Klook","checked":"2026-10-27","note":"Hong Kong codes are listed in HK$ and most have a minimum spend and a quota, so popular ones run out early. Many need a specific card or wallet (Mastercard, UnionPay, PayMe, AlipayHK, Octopus). Enter the code on the payment page; one code per order.","color":["#ff7a1a","#e2540a"],"note_zh":"香港優惠碼以港幣列出，大多有最低消費及名額，熱門的很快用完。很多須用指定信用卡或電子錢包（Mastercard、銀聯、PayMe、AlipayHK、八達通）。在付款頁輸入優惠碼，每張訂單限用一個。","cats":["Activities","Car rental","Hotels","Travel extras"],"note_sc":"香港优惠码以港币列出，大多有最低消费及名额，热门的很快用完。很多须用指定信用卡或电子钱包（Mastercard、银联、PayMe、AlipayHK、八达通）。在付款页输入优惠码，每张订单限用一个。"},"hotelscom":{"name":"Hotels.com","checked":"2026-10-27","note":"The 8% codes work on the Hong Kong site with a card issued in Hong Kong. One room per booking, and not with \"Pay at hotel\". Some codes only work through the bank's own Hotels.com link.","color":["#e0314b","#b01f37"],"note_zh":"92 折優惠碼適用於香港網站及香港發出的信用卡。每次預訂一間房，不適用於「到店付款」。部分優惠碼只能經銀行專屬的 Hotels.com 連結使用。","cats":["Hotels"],"note_sc":"92 折优惠码适用于香港网站及香港发出的信用卡。每次预订一间房，不适用于「到店付款」。部分优惠码只能经银行专属的 Hotels.com 连结使用。"},"expedia":{"name":"Expedia","checked":"2026-10-27","note":"Bank codes work only on the bank's own Expedia Hong Kong page (for example expedia.com.hk/amex), for prepaid hotel-only bookings. Packages and pay-at-hotel rates don't qualify. Type the code in \"Enter voucher code\" at payment.","color":["#1f3a8a","#132559"],"note_zh":"銀行優惠碼只適用於銀行專屬的 Expedia 香港頁面（例如 expedia.com.hk/amex），只限預付純酒店預訂。套票及到店付款不適用。在付款時「輸入優惠碼」一欄輸入。","cats":["Hotels","Flights","Activities"],"note_sc":"银行优惠码只适用于银行专属的 Expedia 香港页面（例如 expedia.com.hk/amex），只限预付纯酒店预订。套票及到店付款不适用。在付款时「输入优惠码」一栏输入。"},"agoda":{"name":"Agoda","checked":"2026-10-27","note":"Most Agoda savings are claim-link deals and card pages, not codes. Codes take a percentage off the room rate only (not taxes), and the real saving is often smaller than the headline.","color":["#7c3aed","#5420b8"],"note_zh":"Agoda 的優惠大多是領取連結及信用卡專頁，而非優惠碼。優惠碼只減房價百分比（不包稅項），實際省下的通常比標題少。","cats":["Hotels"],"note_sc":"Agoda 的优惠大多是领取连结及信用卡专页，而非优惠码。优惠码只减房价百分比（不包税项），实际省下的通常比标题少。"},"booking":{"name":"Booking.com","checked":"2026-10-27","note":"Booking.com almost never uses public promo codes. Sign in to get Genius prices (10–20% off at properties with the blue Genius label) and look for Getaway or Late Escape deals. Codes on coupon sites are usually fake or partner-only.","color":["#1556c9","#0b3a8f"],"note_zh":"Booking.com 幾乎從不使用公開優惠碼。登入後可享 Genius 價（有藍色 Genius 標籤的住宿 8 至 9 折），並留意 Getaway 或 Late Escape 優惠。優惠網站上的優惠碼通常是假的或只限合作夥伴。","cats":["Hotels"],"note_sc":"Booking.com 几乎从不使用公开优惠码。登入后可享 Genius 价（有蓝色 Genius 标签的住宿 8 至 9 折），并留意 Getaway 或 Late Escape 优惠。优惠网站上的优惠码通常是假的或只限合作伙伴。"},"skyscanner":{"name":"Skyscanner","checked":"2026-10-27","note":"Skyscanner is a price comparison site, not a seller, so it has no promo codes. You book on the airline or agent site it sends you to (Trip.com, Opodo, Kiwi.com, the airline). Apply codes for that site instead. The same goes for Kayak and Google Flights.","color":["#0b7ad1","#075a9c"],"note_zh":"Skyscanner 是比價網站，不是賣家，所以沒有優惠碼。你會在它轉介的航空公司或代理網站預訂（Trip.com、Opodo、Kiwi.com、航空公司），改用該網站的優惠碼。Kayak 及 Google Flights 亦一樣。","cats":["Flights"],"note_sc":"Skyscanner 是比价网站，不是卖家，所以没有优惠码。你会在它转介的航空公司或代理网站预订（Trip.com、Opodo、Kiwi.com、航空公司），改用该网站的优惠码。Kayak 及 Google Flights 亦一样。"},"kiwi":{"name":"Kiwi.com","checked":"2026-10-27","note":"Kiwi.com codes on coupon sites are mostly old. One code per booking. Check the price drops before you pay.","color":["#00a69c","#007a73"],"note_zh":"優惠網站上的 Kiwi.com 優惠碼大多已舊。每次預訂限用一個。付款前檢查價格有否下降。","cats":["Flights"],"note_sc":"优惠网站上的 Kiwi.com 优惠码大多已旧。每次预订限用一个。付款前检查价格有否下降。"},"opodo":{"name":"Opodo / eDreams","checked":"2026-10-27","note":"Opodo and eDreams push their paid Prime membership for discounts. Coupon-site codes hide the code text and many are old Black Friday codes. App-only offers come and go.","color":["#c2185b","#8e0f41"],"note_zh":"Opodo 及 eDreams 主力推銷付費 Prime 會員折扣。優惠網站隱藏優惠碼文字，很多是舊的黑色星期五優惠碼。App 專屬優惠時有時無。","cats":["Flights"],"note_sc":"Opodo 及 eDreams 主力推销付费 Prime 会员折扣。优惠网站隐藏优惠码文字，很多是旧的黑色星期五优惠码。App 专属优惠时有时无。"},"avis":{"name":"Avis","checked":"2026-10-27","note":"Avis uses AWD numbers (company or club rates) and coupon codes. Public savings come from the free Avis Preferred programme and offers on the Avis deals page. Only use an AWD number you're entitled to; the counter can check.","color":["#dc2626","#a51b1b"],"note_zh":"Avis 使用 AWD 編號（公司或會所價）及優惠券碼。公開優惠來自免費的 Avis Preferred 計劃及 Avis 優惠頁。只使用你有資格的 AWD 編號，櫃枱可以查核。","cats":["Car rental"],"note_sc":"Avis 使用 AWD 编号（公司或会所价）及优惠券码。公开优惠来自免费的 Avis Preferred 计划及 Avis 优惠页。只使用你有资格的 AWD 编号，柜台可以查核。"},"hertz":{"name":"Hertz","checked":"2026-10-27","note":"Hertz discounts use a CDP code (from an employer, club or card) plus an optional PC promotional code. Using a CDP you're not entitled to can get the rental repriced at the counter.","color":["#facc15","#d4a90b","#1a1600"],"note_zh":"Hertz 折扣使用 CDP 碼（來自僱主、會所或信用卡）加可選的 PC 推廣碼。使用不合資格的 CDP，櫃枱可能重新計價。","cats":["Car rental"],"note_sc":"Hertz 折扣使用 CDP 码（来自雇主、会所或信用卡）加可选的 PC 推广码。使用不合资格的 CDP，柜台可能重新计价。"},"sixt":{"name":"Sixt","checked":"2026-10-27","note":"Sixt has few public rental codes. Most shared codes are for its chauffeur and ride service. Check the Sixt offers page for your country.","color":["#f97316","#c75a0c"],"note_zh":"Sixt 公開租車優惠碼很少。大部分流傳的優惠碼是專車服務用的。查看你所在國家的 Sixt 優惠頁。","cats":["Car rental"],"note_sc":"Sixt 公开租车优惠码很少。大部分流传的优惠码是专车服务用的。查看你所在国家的 Sixt 优惠页。"},"rentalcars":{"name":"Rentalcars.com","checked":"2026-10-27","note":"Rentalcars.com rarely accepts codes. Coupon-site codes were last seen working in 2022. Card and airline partner links are the reliable way to get a discount.","color":["#2563eb","#1846b3"],"note_zh":"Rentalcars.com 很少接受優惠碼。優惠網站的優惠碼最後一次有效是 2022 年。信用卡及航空公司合作連結才是可靠的折扣途徑。","cats":["Car rental"],"note_sc":"Rentalcars.com 很少接受优惠码。优惠网站的优惠码最后一次有效是 2022 年。信用卡及航空公司合作连结才是可靠的折扣途径。"},"discovercars":{"name":"Discover Cars","checked":"2026-10-27","note":"One code per booking, not combined with other promotions, and usually not on prepaid partner packages from Hertz or Europcar.","color":["#0ea5e9","#0a7fb4"],"note_zh":"每次預訂限用一個優惠碼，不可與其他推廣同用，通常不適用於 Hertz 或 Europcar 的預付套票。","cats":["Car rental"],"note_sc":"每次预订限用一个优惠码，不可与其他推广同用，通常不适用于 Hertz 或 Europcar 的预付套票。"},"iherb":{"name":"iHerb","checked":"2026-10-27","note":"One code per order. HK codes need a Hong Kong delivery address and often an account limit. Codes take money off the product total, not shipping.","color":["#4caf50","#2f8a34"],"note_zh":"每張訂單限用一個優惠碼。香港優惠碼須用香港送貨地址，通常有帳戶限制。優惠碼只減貨品總額，不減運費。","cats":["Shopping"],"note_sc":"每张订单限用一个优惠码。香港优惠码须用香港送货地址，通常有账户限制。优惠码只减货品总额，不减运费。"},"hktvmall":{"name":"HKTVmall","checked":"2026-10-27","note":"Most codes are for specific categories (beauty, baby, appliances) and only count spend on those items. VIP members get 5% on Wednesdays and Citi HKTVmall cardholders 5% on Thursdays, with codes shown in the app.","color":["#00a0e9","#0077b0"],"note_zh":"大部分優惠碼只適用於指定類別（美容、嬰兒、電器），只計算該類貨品的消費。VIP 會員逢星期三 95 折，Citi HKTVmall 信用卡逢星期四 95 折，優惠碼在 App 內顯示。","cats":["Shopping"],"note_sc":"大部分优惠码只适用于指定类别（美容、婴儿、电器），只计算该类货品的消费。VIP 会员逢星期三 95 折，Citi HKTVmall 信用卡逢星期四 95 折，优惠码在 App 内显示。"},"taobao":{"name":"Taobao","checked":"2026-10-27","note":"Codes are in RMB (¥) and first come, first served, especially during Double 11 (20 Oct to 13 Nov 2026). Payment method matters: AlipayHK and PayMe have their own codes, and a normal HK credit card adds about 5% in fees.","color":["#ff5000","#d13f00"],"note_zh":"優惠碼以人民幣（¥）計，先到先得，雙 11 期間（2026 年 10 月 20 日至 11 月 13 日）尤其如此。付款方式有影響：AlipayHK 及 PayMe 有各自的優惠碼，一般香港信用卡會多收約 5% 手續費。","cats":["Shopping"],"note_sc":"优惠码以人民币（¥）计，先到先得，双 11 期间（2026 年 10 月 20 日至 11 月 13 日）尤其如此。付款方式有影响：AlipayHK 及 PayMe 有各自的优惠码，一般香港信用卡会多收约 5% 手续费。"},"zalora":{"name":"Zalora","checked":"2026-10-27","note":"One code per order. Free delivery from HK$299. New members get a first-order discount after signing up to the newsletter.","color":["#2b2b33","#16161b"],"note_zh":"每張訂單限用一個優惠碼。滿 HK$299 免運費。新會員訂閱電子報後可享首單折扣。","cats":["Shopping"],"note_sc":"每张订单限用一个优惠码。满 HK$299 免运费。新会员订阅电子报后可享首单折扣。"},"dyson":{"name":"Dyson","checked":"2026-10-27","note":"Codes work on selected products only on the Dyson Hong Kong online store.","color":["#6d28d9","#4c1a9e"],"note_zh":"優惠碼只適用於 Dyson 香港網店的指定產品。","cats":["Shopping"],"note_sc":"优惠码只适用于 Dyson 香港网店的指定产品。"},"watsons":{"name":"Watsons","checked":"2026-10-27","note":"Watsons online codes are often free gifts with a minimum spend, not money off.","color":["#00a3a1","#007775"],"note_zh":"屈臣氏網店優惠碼通常是滿額送禮品，不是減價。","cats":["Shopping"],"note_sc":"屈臣氏网店优惠码通常是满额送礼品，不是减价。"},"pns":{"name":"PARKnSHOP","checked":"2026-10-27","note":"Online store codes. Some only work with click & collect.","color":["#e11d48","#a8122f"],"note_zh":"網店優惠碼。部分只適用於店舖自取。","cats":["Shopping"],"note_sc":"网店优惠码。部分只适用于店舖自取。"},"charleskeith":{"name":"Charles & Keith","checked":"2026-10-27","note":"First-purchase code on the Hong Kong online store.","color":["#a16207","#713f04"],"note_zh":"香港網店首次購物優惠碼。","cats":["Shopping"],"note_sc":"香港网店首次购物优惠码。"},"crocs":{"name":"Crocs","checked":"2026-10-27","note":"New member code on the Hong Kong online store.","color":["#65a30d","#497a07"],"note_zh":"香港網店新會員優惠碼。","cats":["Shopping"],"note_sc":"香港网店新会员优惠码。"},"foodpanda":{"name":"foodpanda","checked":"2026-10-27","note":"Enter the code at checkout in the app. New-user codes work on your first order only. Card and wallet codes have a limited quota each month. pandapro members get free delivery from HK$120 at many restaurants.","color":["#ff2b85","#d0156a"],"note_zh":"在 App 結帳時輸入優惠碼。新用戶優惠碼只適用於首單。信用卡及電子錢包優惠碼每月限量。pandapro 會員在很多餐廳滿 HK$120 免運費。","cats":["Food & rides"],"note_sc":"在 App 结账时输入优惠码。新用户优惠码只适用于首单。信用卡及电子钱包优惠码每月限量。pandapro 会员在很多餐厅满 HK$120 免运费。"},"keeta":{"name":"Keeta","checked":"2026-10-27","note":"Codes are tied to the payment method (AlipayHK, PayMe) and run until the quota runs out. New users get bigger first-order discounts automatically in the app.","color":["#ffd60a","#e0b800","#1a1600"],"note_zh":"優惠碼與付款方式掛鈎（AlipayHK、PayMe），額滿即止。新用戶在 App 內自動獲得更大的首單折扣。","cats":["Food & rides"],"note_sc":"优惠码与付款方式挂钩（AlipayHK、PayMe），额满即止。新用户在 App 内自动获得更大的首单折扣。"},"airalo":{"name":"Airalo","checked":"2026-10-27","note":"Travel eSIM. One code per purchase; new-account codes only work on a fresh account.","color":["#0f766e","#0a5751"],"note_zh":"旅遊 eSIM。每次購買限用一個優惠碼；新帳戶優惠碼只適用於全新帳戶。","cats":["Travel extras"],"note_sc":"旅游 eSIM。每次购买限用一个优惠码；新账户优惠码只适用于全新账户。"},"trainline":{"name":"Trainline","checked":"2026-10-27","note":"Trainline rarely has public codes. The referral discount attaches to your email, so there is no code to type.","color":["#01c3a7","#009883"],"note_zh":"Trainline 很少有公開優惠碼。推薦折扣綁定你的電郵，不用輸入優惠碼。","cats":["Travel extras"],"note_sc":"Trainline 很少有公开优惠码。推荐折扣绑定你的电子邮件，不用输入优惠码。"},"moretickets":{"name":"MoreTickets","checked":"2026-10-27","note":"Concert and show tickets for Hong Kong and Macau.","color":["#9333ea","#6b21a8"],"note_zh":"香港及澳門演唱會及表演門票。","cats":["Activities"],"note_sc":"香港及澳门演唱会及表演门票。"},"airbnb":{"name":"Airbnb","checked":"2026-10-27","note":"Airbnb rarely has public promo codes. Savings come from weekly and monthly stay discounts set by hosts, and Airbnb gift cards sometimes sold below face value. Coupon-site codes are often referral credits for new accounts.","note_zh":"Airbnb 很少有公開優惠碼。省錢方法主要是房東設定的每週及每月長住折扣，以及偶爾低於面值出售的 Airbnb 禮品卡。優惠網站上的優惠碼多是新帳戶的推薦獎賞。","color":["#ff385c","#d90b3e"],"cats":["Hotels"],"note_sc":"Airbnb 很少有公开优惠码。省钱方法主要是房东设定的每周及每月长住折扣，以及偶尔低于面值出售的 Airbnb 礼品卡。优惠网站上的优惠码多是新账户的推荐奖赏。"},"marriott":{"name":"Marriott Bonvoy","checked":"2026-10-27","note":"Book on marriott.com while signed in to the free Marriott Bonvoy programme to get member rates, usually a few percent below the public rate. Promo and corporate codes go in the \"Special rates\" box; only use a corporate code you're entitled to.","note_zh":"登入免費的 Marriott Bonvoy 會員後在 marriott.com 預訂，可享會員價，通常比公開價低幾個百分點。推廣碼及公司碼在「特別房價」一欄輸入；只使用你有資格的公司碼。","color":["#8a1538","#5e0e26"],"cats":["Hotels"],"note_sc":"登入免费的 Marriott Bonvoy 会员后在 marriott.com 预订，可享会员价，通常比公开价低几个百分点。推广码及公司码在「特别房价」一栏输入；只使用你有资格的公司码。"},"hilton":{"name":"Hilton","checked":"2026-10-27","note":"Hilton Honors is free to join and members get a discounted member rate when booking direct on hilton.com or the app. Promotion codes go in \"Special rates\" at search.","note_zh":"Hilton Honors 免費加入，會員在 hilton.com 或 App 直接預訂可享會員折扣價。推廣碼在搜尋時的「特別房價」輸入。","color":["#104c97","#0a3366"],"cats":["Hotels"],"note_sc":"Hilton Honors 免费加入，会员在 hilton.com 或 App 直接预订可享会员折扣价。推广码在搜寻时的「特别房价」输入。"},"ihg":{"name":"IHG Hotels","checked":"2026-10-27","note":"IHG One Rewards members get a member rate at Holiday Inn, InterContinental, Crowne Plaza and other IHG hotels. Sign in before searching to see it.","note_zh":"IHG One Rewards 會員在 Holiday Inn、InterContinental、Crowne Plaza 等 IHG 酒店可享會員價。搜尋前先登入即可看到。","color":["#2d6a4f","#1b4332"],"cats":["Hotels"],"note_sc":"IHG One Rewards 会员在 Holiday Inn、InterContinental、Crowne Plaza 等 IHG 酒店可享会员价。搜寻前先登入即可看到。"},"cathay":{"name":"Cathay Pacific","checked":"2026-10-27","note":"Cathay promo codes are usually tied to a card (HSBC, Mastercard, PayPal) or a region's website, and go in the promo code box on the booking page. Check the Offers page for your country; Asia Miles members also get member-only fares.","note_zh":"國泰優惠碼通常與信用卡（滙豐、Mastercard、PayPal）或某地區網站掛鈎，在預訂頁的優惠碼欄輸入。查看你所在地區的優惠頁；亞洲萬里通會員亦有會員專享票價。","color":["#006564","#00403f"],"cats":["Flights"],"note_sc":"国泰优惠码通常与信用卡（汇丰、Mastercard、PayPal）或某地区网站挂钩，在预订页的优惠码栏输入。查看你所在地区的优惠页；亚洲万里通会员亦有会员专享票价。"},"hkexpress":{"name":"HK Express","checked":"2026-10-27","note":"HK Express runs flash fare sales and payment partner offers (AlipayHK, bank cards) more often than public codes. Promo codes go in the box on the first booking step. Bags and seats cost extra, so compare the total.","note_zh":"HK Express 較常推出閃購機票及付款夥伴優惠（AlipayHK、銀行卡），公開優惠碼較少。優惠碼在預訂第一步輸入。行李及選位另外收費，比較總價。","color":["#7b2d8e","#56206a"],"cats":["Flights"],"note_sc":"HK Express 较常推出闪购机票及付款伙伴优惠（AlipayHK、银行卡），公开优惠码较少。优惠码在预订第一步输入。行李及选位另外收费，比较总价。"},"googleflights":{"name":"Google Flights","checked":"2026-10-27","note":"Google Flights compares fares and sends you to the airline or agent to pay, so it has no promo codes. Turn on price tracking for your route and use the seller's codes when you book.","note_zh":"Google Flights 只比較票價，再轉你到航空公司或代理付款，所以沒有優惠碼。為你的航線開啟價格追蹤，預訂時改用賣家的優惠碼。","color":["#4285f4","#2a63c9"],"cats":["Flights"],"note_sc":"Google Flights 只比较票价，再转你到航空公司或代理付款，所以没有优惠码。为你的航线开启价格追踪，预订时改用卖家的优惠码。"},"kayak":{"name":"Kayak","checked":"2026-10-27","note":"Kayak is a price comparison site, so its codes are rare. Use its price alerts and then apply the seller's codes when you book.","note_zh":"Kayak 是比價網站，優惠碼很少。使用價格提示，預訂時改用賣家的優惠碼。","color":["#ff690f","#d4520a"],"cats":["Flights"],"note_sc":"Kayak 是比价网站，优惠码很少。使用价格提示，预订时改用卖家的优惠码。"},"singapore":{"name":"Singapore Airlines","checked":"2026-10-27","note":"Singapore Airlines promo codes are mostly bank or card offers tied to one country's website. KrisFlyer members get occasional member fares.","note_zh":"新加坡航空的優惠碼多是綁定某國網站的銀行或信用卡優惠。KrisFlyer 會員不時有會員票價。","color":["#1d2b5c","#0f1838"],"cats":["Flights"],"note_sc":"新加坡航空的优惠码多是绑定某国网站的银行或信用卡优惠。KrisFlyer 会员不时有会员票价。"},"enterprise":{"name":"Enterprise","checked":"2026-10-27","note":"Enterprise discounts come from corporate accounts and Enterprise Plus membership. Use a corporate code only if you're entitled to it.","note_zh":"Enterprise 折扣來自公司帳戶及 Enterprise Plus 會員。只使用你有資格的公司碼。","color":["#169a5a","#0d6b3e"],"cats":["Car rental"],"note_sc":"Enterprise 折扣来自公司账户及 Enterprise Plus 会员。只使用你有资格的公司码。"},"budget":{"name":"Budget","checked":"2026-10-27","note":"Budget is part of the Avis group and uses BCD numbers (company rates) and coupon codes. Pay Now rates are usually cheaper than Pay Later.","note_zh":"Budget 屬 Avis 集團，使用 BCD 編號（公司價）及優惠券碼。即付價通常比後付價便宜。","color":["#f26722","#c44f13"],"cats":["Car rental"],"note_sc":"Budget 属 Avis 集团，使用 BCD 编号（公司价）及优惠券码。即付价通常比后付价便宜。"},"alamo":{"name":"Alamo","checked":"2026-10-27","note":"Alamo shows its discounts as built-in deals by country; coupon codes are uncommon. Alamo Insiders (free) gives a small discount in many countries.","note_zh":"Alamo 的折扣多以各國內置優惠顯示，優惠券碼不常見。免費的 Alamo Insiders 在多國可享少量折扣。","color":["#00447c","#002d52"],"cats":["Car rental"],"note_sc":"Alamo 的折扣多以各国内置优惠显示，优惠券码不常见。免费的 Alamo Insiders 在多国可享少量折扣。"},"holafly":{"name":"Holafly","checked":"2026-10-27","note":"Travel eSIM with unlimited data plans. One code per purchase, applied at checkout.","note_zh":"無限數據旅遊 eSIM。每次購買限用一個優惠碼，結帳時輸入。","color":["#e6007e","#b30062"],"cats":["Travel extras"],"note_sc":"无限数据旅游 eSIM。每次购买限用一个优惠码，结账时输入。"},"omio":{"name":"Omio","checked":"2026-10-27","note":"Omio sells trains, buses and flights in Europe. Codes are mostly for new users in the app.","note_zh":"Omio 售賣歐洲火車、巴士及機票。優惠碼多是 App 新用戶專用。","color":["#1f4fff","#1438c2"],"cats":["Travel extras"],"note_sc":"Omio 售卖欧洲火车、巴士及机票。优惠码多是 App 新用户专用。"},"raileurope":{"name":"Rail Europe","checked":"2026-10-27","note":"European train tickets and rail passes in one place. Sales are seasonal; codes go in the basket.","note_zh":"一站式購買歐洲火車票及鐵路通行證。折扣按季推出，優惠碼在購物車輸入。","color":["#00a19a","#00756f"],"cats":["Travel extras"],"note_sc":"一站式购买欧洲火车票及铁路通行证。折扣按季推出，优惠码在购物车输入。"},"twelvego":{"name":"12Go","checked":"2026-10-27","note":"Trains, buses and ferries across Southeast Asia. Codes are uncommon; prices are already close to the operators'.","note_zh":"東南亞火車、巴士及渡輪票。優惠碼不常見，價格本身已接近營運商價。","color":["#0b7fab","#075a7a"],"cats":["Travel extras"],"note_sc":"东南亚火车、巴士及渡轮票。优惠码不常见，价格本身已接近营运商价。"},"prioritypass":{"name":"Priority Pass","checked":"2026-10-27","note":"Airport lounge membership. Many HK credit cards include free Priority Pass visits, which usually beats any code.","note_zh":"機場貴賓室會籍。很多香港信用卡已包免費 Priority Pass 使用次數，通常比任何優惠碼更划算。","color":["#1c1c1c","#000000","#e8c37e"],"cats":["Travel extras"],"note_sc":"机场贵宾室会籍。很多香港信用卡已包免费 Priority Pass 使用次数，通常比任何优惠码更划算。"},"welcomepickups":{"name":"Welcome Pickups","checked":"2026-10-27","note":"Pre-booked airport transfers with an English-speaking driver. First-ride codes are common for new accounts.","note_zh":"預約機場接送，司機會說英語。新帳戶常有首程優惠碼。","color":["#ff5a5f","#d9393e"],"cats":["Travel extras"],"note_sc":"预约机场接送，司机会说英语。新账户常有首程优惠码。"},"safetywing":{"name":"SafetyWing","checked":"2026-10-27","note":"Travel and nomad insurance billed every 4 weeks. Discounts are usually referral links rather than codes. Check what it covers before you buy.","note_zh":"按每 4 星期收費的旅遊及遊牧保險。折扣多是推薦連結而非優惠碼。購買前先看清保障範圍。","color":["#5b2bff","#3f17cc"],"cats":["Travel extras"],"note_sc":"按每 4 星期收费的旅游及游牧保险。折扣多是推荐连结而非优惠码。购买前先看清保障范围。"},"amazon":{"name":"Amazon","checked":"2026-10-27","note":"Amazon.com and Amazon.co.uk ship many items to Hong Kong. Codes are product-specific (clip the coupon on the product page). Prime free shipping to HK depends on the store and order size.","note_zh":"Amazon.com 及 Amazon.co.uk 很多貨品可寄香港。優惠碼多是個別產品專用（在產品頁點選優惠券）。Prime 免運費到香港視乎網站及訂單金額。","color":["#232f3e","#131921","#ff9900"],"cats":["Shopping"],"note_sc":"Amazon.com 及 Amazon.co.uk 很多货品可寄香港。优惠码多是个别产品专用（在产品页点选优惠券）。Prime 免运费到香港视乎网站及订单金额。"},"aliexpress":{"name":"AliExpress","checked":"2026-10-27","note":"Codes are store coupons or platform codes with a minimum spend, and they peak during 11.11 and other big sales. One platform code per order.","note_zh":"優惠碼分店舖優惠券及平台碼，都有最低消費，在 11.11 等大型購物節最多。每張訂單限用一個平台碼。","color":["#e62e04","#b32403"],"cats":["Shopping"],"note_sc":"优惠码分店舖优惠券及平台码，都有最低消费，在 11.11 等大型购物节最多。每张订单限用一个平台码。"},"temu":{"name":"Temu","checked":"2026-10-27","note":"New-user bundles and percentage codes are common. Check the final price after shipping and the return conditions.","note_zh":"常有新用戶優惠包及百分比折扣碼。留意運費後的最終價格及退貨條件。","color":["#fb7701","#d15f00"],"cats":["Shopping"],"note_sc":"常有新用户优惠包及百分比折扣码。留意运费后的最终价格及退货条件。"},"shein":{"name":"Shein","checked":"2026-10-27","note":"Codes are tiered by spend (e.g. a bigger discount over a higher total). One code per order.","note_zh":"優惠碼按消費金額分級（消費越多折扣越大）。每張訂單限用一個。","color":["#111111","#000000"],"cats":["Shopping"],"note_sc":"优惠码按消费金额分级（消费越多折扣越大）。每张订单限用一个。"},"farfetch":{"name":"Farfetch","checked":"2026-10-27","note":"Luxury fashion from boutiques worldwide, ships to HK. App first-order codes are the most common; sale items are often excluded.","note_zh":"來自全球精品店的奢侈時裝，可寄香港。最常見的是 App 首單優惠碼；減價貨品通常不適用。","color":["#222222","#000000"],"cats":["Shopping"],"note_sc":"来自全球精品店的奢侈时装，可寄香港。最常见的是 App 首单优惠码；减价货品通常不适用。"},"asos":{"name":"ASOS","checked":"2026-10-27","note":"ASOS ships to Hong Kong. Codes appear around sales and student discounts (via UNiDAYS). One code per order.","note_zh":"ASOS 可寄香港。優惠碼多在減價期出現，學生可經 UNiDAYS 享折扣。每張訂單限用一個。","color":["#2d2d2d","#111111"],"cats":["Shopping"],"note_sc":"ASOS 可寄香港。优惠码多在减价期出现，学生可经 UNiDAYS 享折扣。每张订单限用一个。"},"selfridges":{"name":"Selfridges","checked":"2026-10-27","note":"London department store with international delivery to Hong Kong. Public codes are rare; savings come from seasonal sales and Selfridges Plus delivery.","note_zh":"倫敦百貨公司，提供寄往香港的國際送貨。公開優惠碼很少，省錢主要靠季節性減價及 Selfridges Plus 送貨服務。","color":["#ffe500","#e0c800","#1a1600"],"cats":["Shopping"],"note_sc":"伦敦百货公司，提供寄往香港的国际送货。公开优惠码很少，省钱主要靠季节性减价及 Selfridges Plus 送货服务。"},"harrods":{"name":"Harrods","checked":"2026-10-27","note":"London department store that ships to Hong Kong. Harrods almost never issues public codes; Harrods Rewards members earn points and get sale previews.","note_zh":"寄往香港的倫敦百貨公司。Harrods 幾乎從不發出公開優惠碼；Harrods Rewards 會員可賺積分及搶先參與減價。","color":["#00472b","#002e1c","#d4b46a"],"cats":["Shopping"],"note_sc":"寄往香港的伦敦百货公司。Harrods 几乎从不发出公开优惠码；Harrods Rewards 会员可赚积分及抢先参与减价。"},"uber":{"name":"Uber","checked":"2026-10-27","note":"Uber works in Hong Kong and most countries. Promo codes go in Wallet → Promotions in the app before you ride. New-rider codes only work on a new account.","note_zh":"Uber 在香港及大部分國家都可使用。乘車前在 App「錢包 → 優惠」輸入優惠碼。新乘客優惠碼只適用於新帳戶。","color":["#000000","#1a1a1a"],"cats":["Food & rides"],"note_sc":"Uber 在香港及大部分国家都可使用。乘车前在 App「钱包 → 优惠」输入优惠码。新乘客优惠码只适用于新账户。"},"ubereats":{"name":"Uber Eats","checked":"2026-10-27","note":"Food delivery in many countries (not Hong Kong). Codes go in the checkout screen; first-order codes need a new account.","note_zh":"多國可用的外賣平台（香港沒有）。在結帳頁輸入優惠碼；首單優惠碼需新帳戶。","color":["#06c167","#04964f"],"cats":["Food & rides"],"note_sc":"多国可用的外卖平台（香港没有）。在结账页输入优惠码；首单优惠码需新账户。"},"grab":{"name":"Grab","checked":"2026-10-27","note":"Rides and food in Singapore, Malaysia, Thailand and other Southeast Asian countries. Codes are per country; add them under Offers in the app.","note_zh":"在新加坡、馬來西亞、泰國等東南亞國家提供乘車及外賣。優惠碼按國家分，在 App「優惠」加入。","color":["#00b14f","#008a3d"],"cats":["Food & rides"],"note_sc":"在新加坡、马来西亚、泰国等东南亚国家提供乘车及外卖。优惠码按国家分，在 App「优惠」加入。"},"didi":{"name":"DiDi","checked":"2026-10-27","note":"Ride hailing in Mainland China (DiDi also runs in Hong Kong). New-user coupons appear in the app; HK visitors can link AlipayHK or a card.","note_zh":"中國內地叫車平台（香港亦有 DiDi）。新用戶優惠券在 App 內顯示；香港旅客可綁定 AlipayHK 或信用卡。","color":["#ff7e33","#e0611a"],"cats":["Food & rides"],"note_sc":"中国内地叫车平台（香港亦有 DiDi）。新用户优惠券在 App 内显示；香港旅客可绑定 AlipayHK 或信用卡。"},"hktaxi":{"name":"HKTaxi","checked":"2026-10-27","note":"Hong Kong's taxi-hailing app. Discounts come from payment partners and app promotions rather than public codes.","note_zh":"香港召的士 App。折扣多來自付款夥伴及 App 推廣，而非公開優惠碼。","color":["#d71920","#a81218"],"cats":["Food & rides"],"note_sc":"香港召的士 App。折扣多来自付款伙伴及 App 推广，而非公开优惠码。"},"deliveroo":{"name":"Deliveroo","checked":"2026-10-27","note":"Food delivery in the UK and Europe (it left Hong Kong in 2025). First-order codes need a new account; Deliveroo Plus gives free delivery.","note_zh":"英國及歐洲的外賣平台（2025 年已退出香港）。首單優惠碼需新帳戶；Deliveroo Plus 可享免運費。","color":["#00ccbc","#00a396"],"cats":["Food & rides"],"note_sc":"英国及欧洲的外卖平台（2025 年已退出香港）。首单优惠码需新账户；Deliveroo Plus 可享免运费。"},"doordash":{"name":"DoorDash","checked":"2026-10-27","note":"Food delivery in the US, Canada and Australia. First-order codes and DashPass trials are common.","note_zh":"美國、加拿大及澳洲的外賣平台。常有首單優惠碼及 DashPass 試用。","color":["#ff3008","#d12200"],"cats":["Food & rides"],"note_sc":"美国、加拿大及澳洲的外卖平台。常有首单优惠码及 DashPass 试用。"},"bolt":{"name":"Bolt","checked":"2026-10-27","note":"Rides across Europe and Africa, often cheaper than Uber. First-ride codes need a new account.","note_zh":"歐洲及非洲的叫車平台，通常比 Uber 便宜。首程優惠碼需新帳戶。","color":["#34d186","#22a866"],"cats":["Food & rides"],"note_sc":"欧洲及非洲的叫车平台，通常比 Uber 便宜。首程优惠码需新账户。"},"kkday":{"name":"KKday","checked":"2026-10-27","note":"Tours, tickets and transport across Asia. Codes are often tied to a card (HSBC, Citi) or a region's site and go in the payment step.","note_zh":"亞洲的旅遊團、門票及交通。優惠碼通常與信用卡（滙豐、Citi）或地區網站掛鈎，在付款步驟輸入。","color":["#26bec9","#1a96a0"],"cats":["Activities","Travel extras"],"note_sc":"亚洲的旅游团、门票及交通。优惠码通常与信用卡（汇丰、Citi）或地区网站挂钩，在付款步骤输入。"},"getyourguide":{"name":"GetYourGuide","checked":"2026-10-27","note":"Tours and attractions worldwide. App first-booking codes are the most common; free cancellation on most activities.","note_zh":"全球旅遊團及景點。最常見的是 App 首次預訂優惠碼；大部分活動可免費取消。","color":["#ff5533","#d13b1c"],"cats":["Activities"],"note_sc":"全球旅游团及景点。最常见的是 App 首次预订优惠码；大部分活动可免费取消。"},"viator":{"name":"Viator","checked":"2026-10-27","note":"Tripadvisor's tours and activities site. Codes are occasional and mostly for app bookings.","note_zh":"Tripadvisor 旗下的旅遊團及活動網站。優惠碼不常有，多是 App 預訂專用。","color":["#186b6d","#0f4a4c"],"cats":["Activities"],"note_sc":"Tripadvisor 旗下的旅游团及活动网站。优惠码不常有，多是 App 预订专用。"},"cityline":{"name":"Cityline","checked":"2026-10-27","note":"Hong Kong's main concert and show ticketing site. There are no discount codes; bank cards get priority booking periods instead.","note_zh":"香港主要的演唱會及表演門票網站。沒有折扣碼，但銀行卡持有人可享優先訂票。","color":["#e4002b","#b0001f"],"cats":["Activities"],"note_sc":"香港主要的演唱会及表演门票网站。没有折扣码，但银行卡持有人可享优先订票。"},"ticketmaster":{"name":"Ticketmaster","checked":"2026-10-27","note":"Concert and event tickets worldwide. Presale codes come from artist sign-ups and card issuers, not public coupon sites.","note_zh":"全球演唱會及活動門票。預售碼來自歌手登記及信用卡發卡機構，而非優惠網站。","color":["#026cdf","#0151a8"],"cats":["Activities"],"note_sc":"全球演唱会及活动门票。预售码来自歌手登记及信用卡发卡机构，而非优惠网站。"},"tiqets":{"name":"Tiqets","checked":"2026-10-27","note":"Museum and attraction tickets with instant mobile entry. App and newsletter codes are the usual source.","note_zh":"博物館及景點門票 const guessLang = () => { const l = (navigator.language || "").toLowerCase(); return /^zh-(cn|sg)|hans/.test(l) ? "hans" : l.startsWith("zh") ? "hant" : "en"; };
let lang = store.get("zsm-lang", null) || guessLang();
if (!T[lang]) lang = "en";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const L = () => T[lang];
// Pick the field in the current language, falling back to English.
const tx = (o, f) => lang === "en" ? o[f] : (o[f + "_" + (lang === "hans" ? "sc" : "zh")] || o[f + "_zh"] || o[f]);
const catName = c => L().cats[c] || c;
const fmt = d => new Date(d + "T00:00:00").toLocaleDateString(L().locale, { day: "numeric", month: "short", year: "numeric" });

// A code's categories: the ones its text names (worked out at build time), else the one it was saved with.
const inCat = (d, c) => (d._cats || [d.cat]).includes(c);

function matches(d) {
    if (state.region === "all" && state.cat !== "all" && !inCat(d, state.cat)) return false;
  if (state.q) {
    const hay = [SITES[d.site].name, d.cat, catName(d.cat), d.title, d.desc, d.cond, tx(d, "title"), tx(d, "desc"), tx(d, "cond"), d.big, ...(d.codes || [])].join(" ").toLowerCase();
    return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  }
  return true;
}
const sortDeals = list => list.sort((a, b) => RANK[a.eff] - RANK[b.eff] || (marks[a.id] === "no") - (marks[b.id] === "no") || a.order - b.order);

/* ---------- Static text ---------- */
function renderText() {
  document.documentElement.lang = lang === "en" ? "en" : lang === "hans" ? "zh-Hans" : "zh-Hant-HK";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = L()[el.dataset.t]; });
  document.querySelectorAll("[data-ph]").forEach(el => { el.placeholder = L()[el.dataset.ph]; });
  document.querySelectorAll("[data-al]").forEach(el => el.setAttribute("aria-label", L()[el.dataset.al]));
  document.querySelectorAll(".tabbar [data-view]").forEach(b => b.setAttribute("aria-label", L()[b.dataset.view]));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#version").textContent = VERSION;
  $("#set-note").textContent = L().setNote(fmt(DATA.updated));
  $("#darkMode").checked = theme() === "dark";
}

/* ---------- Light / dark ---------- */
const theme = () => document.documentElement.dataset.theme;
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  store.set("zsm-theme", t);
  document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#0b0d12" : "#f2f3f6";
}

/* ---------- Wallet ---------- */
function renderStats() {
  const worked = Object.values(marks).filter(v => v === "yes").length;
  const badge = $("#saved-badge"); badge.hidden = !worked; badge.textContent = worked;
}

// "Best right now": the top ready-to-use code among the sites on screen, by the region's ranking.
function renderHero() {
  const t = L();
  const order = state.region === "all" ? null : regionSites(state.cat);
  const pool = DEALS.filter(d => d.eff === "active" && d.codes && (order ? order.includes(d.site) : true) && (state.cat === "all" || inCat(d, state.cat)));
  pool.sort((a, b) => (order ? order.indexOf(a.site) - order.indexOf(b.site) : 0) || a.order - b.order);
  const d = pool[0], el = $("#hero");
  el.hidden = !d || state.q !== "";
  if (!d) return;
  el.innerHTML = `<div class="hero-top"><span>${t.best} · ${esc(SITES[d.site].name)}</span><span>${d.expires ? t.ends(fmt(d.expires)) : ""}</span></div>
    <div class="hero-big">${esc(tx(d, "big"))}</div>
    <div class="hero-row"><span class="hero-code">${esc(d.codes[0])}</span><button class="hero-copy" data-code="${esc(d.codes[0])}"><span class="cp">${t.copy}</span></button></div>`;
}

// Sites a region ranks in one category (or all its categories), best first.
const regionSites = c => { const r = REGIONS[state.region]; return c === "all" ? [...new Set(Object.values(r).flat())] : r[c] || []; };
const regionCats = () => Object.keys(REGIONS[state.region]);

function renderCats() {
  const t = L();
  const regBtn = r => {
    const n = r === "all" ? Object.keys(SITES).length : new Set(Object.values(REGIONS[r]).flat()).size;
    return `<button class="reg" data-region="${r}" aria-pressed="${state.region === r}"><span class="rn">${esc(t.regions[r] || r)}</span><small>${t.nSites(n)}</small><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>`;
  };
  const has = rs => rs.filter(r => REGIONS[r]);
  $("#regions").innerHTML = regBtn("world")
    + `<div class="reg-h">${t.regGroups[0]}</div>` + has(["hk", "jp", "kr", "tw", "sg"]).map(regBtn).join("")
    + `<div class="reg-h">${t.regGroups[1]}</div>` + has(["uk", "eu", "us"]).map(regBtn).join("")
    + `<div class="reg-h"></div>` + regBtn("all");
  $("#regionName").textContent = t.regions[state.region];
  $("#regionBtn").setAttribute("aria-label", `${t.regionL}: ${t.regions[state.region]}`);
  const live = DEALS.filter(d => !d.dead);
  const inRegion = state.region !== "all";
  $("#cats").innerHTML = ["all", ...(inRegion ? regionCats() : CATS)].map(c => {
    const n = inRegion ? regionSites(c).length     // in a region the tabs count sites, not codes
      : c === "all" ? live.length : live.filter(d => inCat(d, c)).length;
    return `<button class="tab" data-cat="${esc(c)}" aria-pressed="${state.cat === c}">${c === "all" ? L().all : esc(catName(c))}<span class="n">${n}</span></button>`;
  }).join("");
  $("#showDead").checked = state.dead;
}

function dealHtml(d, withSite) {
  const t = L();
  const tags = [`<span class="tag t-${d.eff}">${t.status[d.eff]}</span>`];
  if (d.found === "auto" && !d.dead) tags.push(`<span class="tag t-auto">${t.auto}</span>`);
  if (d.kind === "offer" && !d.dead) tags.push(`<span class="tag t-offer">${t.noCode}</span>`);
  if (!d.dead && d.daysLeft != null && d.daysLeft <= 14) tags.push(`<span class="tag t-soon">${d.daysLeft === 0 ? t.endsToday : t.daysLeft(d.daysLeft)}</span>`);
  let action = "";
  if (d.codes) action = `<div class="codes">${d.codes.map(c => `<button class="code" data-code="${esc(c)}" ${d.dead ? "disabled" : ""} aria-label="${t.copy} ${esc(c)}">${esc(c)}<span class="cp">${t.copy}</span></button>`).join("")}</div>`;
  else if (d.src && !d.dead) action = `<a class="offer-link" href="${esc(d.src)}" target="_blank" rel="noopener">${t.open}</a>`;
  const exp = d.expires ? (d.daysLeft < 0 ? t.ended(fmt(d.expires)) : t.until(fmt(d.expires))) : t.noEnd;
  const m = marks[d.id];
  const src = d.src && (d.codes || d.dead) ? `<a href="${esc(d.src)}" target="_blank" rel="noopener">${t.source}</a>` : "";
  return `<article class="deal ${d.dead ? "dead" : ""}" style="--site:${siteColor(d.site)}">
    ${withSite ? `<span class="saved-site">${esc(SITES[d.site].name)}</span>` : ""}
    <div class="deal-top"><span class="deal-big">${esc(tx(d, "big"))}</span><div class="tags">${tags.join("")}</div><span class="deal-title">${esc(tx(d, "title"))}</span></div>
    <p class="desc">${esc(tx(d, "desc"))}</p>
    <p class="cond">${esc(tx(d, "cond"))}</p>
    ${action}
    <div class="meta"><span>${exp}</span>${src}
      ${d.dead ? "" : `<span class="mine" role="group">
        <button class="yes" data-mark="${esc(d.id)}" data-v="yes" aria-pressed="${m === "yes"}">${t.worked}</button>
        <button class="no" data-mark="${esc(d.id)}" data-v="no" aria-pressed="${m === "no"}">${t.didnt}</button></span>`}</div>
  </article>`;
}

function renderStack() {
  if (state.region !== "all") return renderRegion();
  const t = L();
  const groups = {};
  for (const d of DEALS) if (matches(d)) (groups[d.site] = groups[d.site] || []).push(d);
  // Sites with ready-to-use codes first, then by how many live codes they have.
  // Sites with no deals yet still get a card, so every site in the wallet can be found.
  const q = state.q.toLowerCase();
  for (const k of Object.keys(SITES)) {
    if (groups[k]) continue;
    const inCat = state.cat === "all" || (SITES[k].cats || []).includes(state.cat);
    if (inCat && (!q || SITES[k].name.toLowerCase().includes(q))) groups[k] = [];
  }
  const sites = Object.keys(groups).map(k => {
    const live = sortDeals(groups[k].filter(d => !d.dead));
    return { k, all: groups[k], live, top: live[0] || null, ready: live.filter(d => d.eff === "active").length };
  }).filter(s => s.live.length || state.dead || !s.all.length)
    .sort((a, b) => (b.ready > 0) - (a.ready > 0) || b.live.length - a.live.length || SITES[a.k].name.localeCompare(SITES[b.k].name));
  $("#site-line").textContent = t.siteLine(sites.length);
  if (!sites.length) { $("#stack").innerHTML = `<p class="empty">${esc(t.nothing(state.q))}</p>`; return; }
  $("#stack").innerHTML = sites.map(s => cardHtml(s, s.k, sites.length === 1)).join("");
}

// One region: each category's top sites in rank order. With "All" picked, one section per category.
function renderRegion() {
  const t = L();
  const q = state.q.toLowerCase();
  const cats = state.cat === "all" ? regionCats() : [state.cat];
  let html = "", shown = new Set();
  for (const c of cats) {
    const cards = regionSites(c).map((k, i) => {
      const all = DEALS.filter(d => d.site === k && inCat(d, c) && (!q || matches(d)));
      if (q && !all.length && !SITES[k].name.toLowerCase().includes(q)) return null;
      const live = sortDeals(all.filter(d => !d.dead));
      return { k, all, live, top: live[0] || null, rank: i + 1, cat: c };
    }).filter(Boolean);
    if (!cards.length) continue;
    cards.forEach(s => shown.add(s.k));
    const key = s => cats.length > 1 ? c + "|" + s.k : s.k;
    if (cats.length > 1) html += `<h2 class="sec-h">${esc(catName(c))}<span>${t.top(cards.length)}</span></h2>`;
    html += cards.map(s => cardHtml(s, key(s), false)).join("");
  }
  $("#site-line").textContent = t.regionLine(t.regions[state.region], shown.size);
  $("#stack").innerHTML = html || `<p class="empty">${esc(t.nothing(state.q))}</p>`;
}

function cardHtml(s, key, forceOpen) {
    const t = L();
    const open = state.open === key || forceOpen;
    const cats = s.cat ? catName(s.cat) : [...new Set((s.all.length ? s.all.map(d => d.cat) : SITES[s.k].cats || []).map(catName))].join(" · ");
    let body = "";
    if (open) {
      const dead = sortDeals(s.all.filter(d => d.dead));
      body = `<div class="wcard-body">
        <div class="site-tip"><b>${t.how}</b> ${esc(tx(SITES[s.k], "note"))}</div>
        ${s.live.map(d => dealHtml(d)).join("")}
        ${state.dead && dead.length ? `<div class="dead-h">${t.deadH}</div>${dead.map(d => dealHtml(d)).join("")}` : ""}
        ${!s.all.length ? `<p class="empty">${t.noYet}</p>` : !s.live.length && !state.dead ? `<p class="empty">${t.noLive}</p>` : ""}
      </div>`;
    }
    return `<div class="wcard ${open ? "open" : ""}" style="${cardStyle(s.k)}">
      <button class="wcard-h" data-site="${esc(key)}" aria-expanded="${open}">
        <span class="wcard-name">${s.rank ? `<span class="wcard-rank">#${s.rank}</span>` : ""}${esc(SITES[s.k].name)}</span>
        <span class="wcard-right"><span class="wcard-best">${s.top ? esc(tx(s.top, "big")) : "—"}</span><br><span class="wcard-count">${t.code(s.live.length)}</span></span>
        <span class="wcard-cats">${esc(cats)}</span>
      </button>${body}</div>`;
}

/* ---------- Saved ---------- */
function renderSaved() {
  const t = L();
  const worked = sortDeals(DEALS.filter(d => marks[d.id] === "yes" && !d.dead));
  const soon = sortDeals(DEALS.filter(d => !d.dead && d.daysLeft != null && d.daysLeft <= 7 && d.eff === "active" && marks[d.id] !== "yes"));
  $("#saved").innerHTML =
    `<div class="section-h">${t.workedH}</div>` +
    (worked.length ? `<div class="saved-list">${worked.map(d => dealHtml(d, true)).join("")}</div>` : `<p class="empty" style="padding:20px 0">${esc(t.workedE)}</p>`) +
    `<div class="section-h">${t.weekH}</div>` +
    (soon.length ? `<div class="saved-list">${soon.map(d => dealHtml(d, true)).join("")}</div>` : `<p class="empty" style="padding:20px 0">${t.weekE}</p>`);
}

function render() {
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === state.view));
  $("#view-wallet").hidden = state.view !== "wallet";
  $("#view-saved").hidden = state.view !== "saved";
  $("#view-settings").hidden = state.view !== "settings";
  renderText(); renderStats(); renderCats(); renderHero(); renderStack(); renderSaved(); renderPage();
  store.set("zsm-view", { cat: state.cat, region: state.region, dead: state.dead, view: state.view, open: state.open });
}

/* ---------- Settings pages (terms, privacy) ---------- */
function renderPage() {
  $("#set-main").hidden = !!state.page;
  $("#set-page").hidden = !state.page;
  if (!state.page) return;
  const t = L();
  $("#page-h").textContent = t[state.page];
  $("#page-body").innerHTML = t[state.page + "Body"].map(([h, p]) => `<h3>${esc(h)}</h3><p>${esc(p)}</p>`).join("");
}

/* ---------- Toasts ---------- */
const TOAST_ICONS = { ok: '<path d="M20 6 9 17l-5-5"/>', warn: '<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>' };
function toast(msg, level = "ok") {
  const el = document.createElement("div");
  el.className = "toast " + level;
  el.innerHTML = `<svg viewBox="0 0 24 24">${TOAST_ICONS[level]}</svg><div>${esc(msg)}</div>`;
  const box = $("#toasts"); box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 220); }, 2600);
}
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el.firstChild); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

/* ---------- Region picker ---------- */
function openSheet() {
  $("#sheet").hidden = $("#sheetBg").hidden = false;
  ($("#regions [aria-pressed=true]") || $("#regions .reg")).focus();
}
function closeSheet() {
  if ($("#sheet").hidden) return;
  $("#sheet").hidden = $("#sheetBg").hidden = true;
  $("#regionBtn").focus();
}
$("#sheetBg").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const t = L();
  if (b.id === "regionBtn") openSheet();
  else if (b.dataset.lang) { lang = b.dataset.lang; store.set("zsm-lang", lang); render(); }
  else if (b.dataset.view) { state.view = b.dataset.view; state.page = null; render(); window.scrollTo({ top: 0 }); }
  else if (b.dataset.page) { state.page = b.dataset.page === "back" ? null : b.dataset.page; renderPage(); window.scrollTo({ top: 0 }); }
  else if (b.dataset.cat) { state.cat = b.dataset.cat; state.open = null; render(); b.scrollIntoView({ block: "nearest", inline: "nearest" }); }
  else if (b.dataset.region) {
    state.region = b.dataset.region; state.open = null;
    closeSheet();
    if (state.cat !== "all" && !(state.region === "all" ? CATS : regionCats()).includes(state.cat)) state.cat = "all";
    render();
  }
  else if (b.dataset.site) {
    state.open = state.open === b.dataset.site ? null : b.dataset.site;
    renderStack(); store.set("zsm-view", { cat: state.cat, region: state.region, dead: state.dead, view: state.view, open: state.open });
    if (state.open) { const el = document.querySelector(`[data-site="${state.open}"]`); el && el.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
  }
  else if (b.dataset.code) {
    const code = b.dataset.code;
    const done = () => { b.classList.add("done"); b.querySelector(".cp").textContent = t.copied; toast(t.copiedT(code)); setTimeout(() => { b.classList.remove("done"); b.querySelector(".cp").textContent = L().copy; }, 1600); };
    try { navigator.clipboard.writeText(code).then(done, () => { selectText(b); toast(t.selectT, "warn"); }); }
    catch { selectText(b); toast(t.selectT, "warn"); }
  }
  else if (b.dataset.mark) {
    const id = b.dataset.mark, v = b.dataset.v;
    if (marks[id] === v) delete marks[id]; else marks[id] = v;
    store.set("pcw-marks", marks);
    renderStats(); renderStack(); renderSaved();
    toast(marks[id] ? (v === "yes" ? t.wT : t.nT) : t.cT, marks[id] === "no" ? "warn" : "ok");
  }
});
$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); renderHero(); renderStack(); });
$("#darkMode").addEventListener("change", e => setTheme(e.target.checked ? "dark" : "light"));
$("#showDead").addEventListener("change", e => { state.dead = e.target.checked; render(); });

render();
</script>
</body>
</html>
