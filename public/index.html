<style>
/* Layout: phone-first wallet app. One centred column (wider on desktop), stacked site cards that open in place, fixed bottom tab bar for Wallet / Saved. Deliberately single-theme dark. */
:root {
  color-scheme: dark;
  --bg: #0a0a0c;
  --panel: #141418;
  --panel-2: #1d1d23;
  --line: #2a2a32;
  --ink: #f4f4f6;
  --muted: #9a9aa6;
  --accent: #5b7cff;
  --ok: #3ddc97; --ok-bg: rgba(61,220,151,.12);
  --warn: #ffc85c; --warn-bg: rgba(255,200,92,.12);
  --bad: #ff7a70; --bad-bg: rgba(255,122,112,.12);
  --info: #9fb0ff; --info-bg: rgba(91,124,255,.16);
  --font: "Geist", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  --hk: "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 680px; margin: 0 auto; padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- header ---------- */
.hdr { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo h1 { margin: 0; font: 900 clamp(34px, 8vw, 44px) var(--hk); letter-spacing: .02em; line-height: 1; }
.logo .en { display: block; margin-top: 6px; font-size: 11px; font-weight: 600; letter-spacing: .28em; color: var(--muted); }
.stats { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); }
.stats b { display: block; color: var(--ink); font-size: 18px; font-weight: 700; }

/* ---------- search + chips ---------- */
.tools { margin-top: 18px; display: grid; gap: 12px; }
.field { position: relative; min-width: 0; }
.field input, .field select { width: 100%; height: 54px; padding: 21px 14px 6px 44px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); transition: border-color .15s, box-shadow .15s; }
.field select { appearance: none; -webkit-appearance: none; }
.field label { position: absolute; left: 44px; top: 17px; color: var(--muted); font-size: 14.5px; pointer-events: none; transition: top .15s, font-size .15s; }
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,124,255,.25); }
.field input:focus + label, .field input:not(:placeholder-shown) + label, .field select + label { top: 7px; font-size: 11.5px; letter-spacing: .02em; }
.field .ico { position: absolute; left: 14px; top: 18px; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.chips-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
.chips-wrap::-webkit-scrollbar { display: none; }
.chips { display: flex; gap: 8px; width: max-content; }
.chip { border: 0; background: var(--panel-2); color: #c8c8d2; font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.chip .n { color: var(--muted); margin-left: 5px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.chip[aria-pressed="true"] .n { color: #55555f; }
.sub-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

/* ---------- wallet stack ---------- */
.stack { margin-top: 18px; display: flex; flex-direction: column; }
.wcard { position: relative; border-radius: 20px; margin-top: -26px; box-shadow: 0 -8px 24px rgba(0,0,0,.45); overflow: hidden; transition: margin .25s ease; }
.wcard:first-child { margin-top: 0; }
.wcard.open { margin-top: 14px; margin-bottom: 14px; }
.wcard:first-child.open { margin-top: 0; }
.wcard-h { width: 100%; border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer; padding: 18px 18px 34px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; }
.wcard.open .wcard-h, .wcard:last-child .wcard-h { padding-bottom: 18px; }
.wcard-name { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.wcard-cats { font-size: 13px; opacity: .85; grid-column: 1; }
.wcard-right { grid-row: 1 / span 2; grid-column: 2; text-align: right; }
.wcard-best { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.wcard-count { font-size: 12.5px; font-weight: 600; opacity: .85; }
.wcard-body { background: var(--panel); padding: 6px 12px 12px; display: grid; gap: 10px; }
.site-tip { font-size: 13.5px; color: #c8c8d2; background: var(--panel-2); border-radius: 12px; padding: 11px 13px; }
.site-tip b { color: var(--ink); }

/* ---------- deal rows ---------- */
.deal { background: var(--panel-2); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.deal-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; }
.deal-big { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.deal-title { font-weight: 600; font-size: 15px; grid-column: 1; }
.tags { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.tag { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.t-active { background: var(--ok-bg); color: var(--ok); }
.t-restricted { background: var(--info-bg); color: var(--info); }
.t-unconfirmed, .t-soon { background: var(--warn-bg); color: var(--warn); }
.t-expired, .t-avoid { background: var(--bad-bg); color: var(--bad); }
.t-offer { background: rgba(255,255,255,.07); color: #c8c8d2; }
.desc { margin: 0; color: #dedee6; font-size: 14.5px; }
.cond { margin: 0; color: var(--muted); font-size: 13.5px; }
.codes { display: flex; flex-wrap: wrap; gap: 8px; }
.code { display: inline-flex; align-items: center; gap: 10px; font: 700 15px var(--mono); letter-spacing: .05em; padding: 7px 7px 7px 13px; border-radius: 10px; border: 1px solid var(--line); background: #0f0f13; color: var(--ink); cursor: pointer; transition: border-color .15s, transform .05s; }
.code:hover { border-color: var(--accent); }
.code:active { transform: scale(.98); }
.code .cp { font: 600 11.5px var(--font); letter-spacing: 0; background: var(--ink); color: var(--bg); padding: 3px 9px; border-radius: 6px; }
.code.done .cp { background: var(--ok); }
.dead .code { color: var(--muted); text-decoration: line-through; cursor: default; }
.dead .code .cp { display: none; }
.dead .deal-big { color: var(--muted); }
.offer-link { display: inline-flex; align-items: center; gap: 6px; width: max-content; font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: none; background: #0f0f13; border: 1px solid var(--line); padding: 8px 13px; border-radius: 10px; }
.offer-link:hover { border-color: var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta a { color: var(--muted); }
.mine { display: inline-flex; gap: 6px; margin-left: auto; }
.mine button { font-size: 12.5px; font-weight: 500; border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 4px 10px; border-radius: 8px; cursor: pointer; }
.mine button[aria-pressed="true"].yes { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.mine button[aria-pressed="true"].no { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.dead-h { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 4px 0; }
.empty { text-align: center; color: var(--muted); padding: 48px 12px; }
.section-h { margin: 22px 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.saved-list { display: grid; gap: 10px; }
.saved-list .deal { border-left: 4px solid var(--site, var(--accent)); }
.saved-site { font-size: 12.5px; font-weight: 700; color: var(--site, var(--accent)); filter: brightness(1.35); }

.view-h { margin: 20px 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.view-p { margin: 0 0 16px; color: var(--muted); }
.foot { margin-top: 28px; color: var(--muted); font-size: 12.5px; }

/* ---------- tab bar ---------- */
.tabbar { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; background: rgba(10,10,12,.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar-in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); }
.tabbar button { border: 0; background: transparent; color: var(--muted); padding: 10px 0 12px; display: grid; justify-items: center; gap: 3px; font-size: 12px; font-weight: 600; cursor: pointer; }
.tabbar svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-selected="true"] { color: var(--ink); }
.tabbar .badge { font-size: 10px; background: var(--accent); color: #fff; border-radius: 999px; padding: 0 6px; margin-left: 2px; }

/* ---------- toasts ---------- */
.toasts { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(380px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: #23232b; box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: 14px; font-weight: 500; animation: slide .25s ease-out; }
.toast svg { flex: none; width: 19px; height: 19px; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.toast.ok svg { stroke: var(--ok); } .toast.warn svg { stroke: var(--warn); } .toast.bad svg { stroke: var(--bad); }
.toast.out { animation: fade .2s ease-in forwards; }
@keyframes slide { from { opacity: 0; transform: translateY(10px); } }
@keyframes fade { to { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { .toast, .toast.out, .ck-verdict { animation: none; } .wcard { transition: none; } .spin { animation-duration: 2s; } }

@media (min-width: 720px) {
  .app { padding-top: 32px; }
  .wcard-h { padding: 20px 22px 36px; }
  .wcard-name { font-size: 21px; }
  .wcard-body { padding: 8px 16px 16px; }
}

/* ---------- language switch ---------- */
.hdr-r { display: grid; gap: 10px; justify-items: end; }
.lang { display: inline-flex; background: var(--panel-2); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.t-auto { background: rgba(255,255,255,.07); color: #c8c8d2; }
html[lang^="zh"] body { font-family: var(--font), var(--hk); }
html[lang="zh-Hans"] body { font-family: var(--font), "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
@media (max-width: 719px) { .hdr { position: relative; } .lang { position: absolute; top: 2px; right: 0; } .hdr-r { justify-items: start; } }
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="logo"><h1>著數碼</h1><span class="en">JEUKSOU · PROMO CODE WALLET</span></div>
    <div class="hdr-r">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="false">EN</button>
        <button data-lang="hant" aria-pressed="false">繁</button>
        <button data-lang="hans" aria-pressed="false">简</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <!-- ===== WALLET ===== -->
  <section id="view-wallet">
    <div class="tools">
      <div class="field">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder=" " autocomplete="off">
        <label for="q" data-t="search"></label>
      </div>
      <div class="chips-wrap"><div class="chips" id="cats"></div></div>
      <div class="sub-row"><span id="site-line"></span><label class="toggle" for="showDead"><input type="checkbox" id="showDead"> <span data-t="showDead"></span></label></div>
    </div>
    <div class="stack" id="stack"></div>
  </section>

  <!-- ===== SAVED ===== -->
  <section id="view-saved" hidden>
    <h2 class="view-h" data-t="saved"></h2>
    <p class="view-p" data-t="savedP"></p>
    <div id="saved"></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<nav class="tabbar" aria-label="Sections"><div class="tabbar-in" role="tablist">

  <button role="tab" data-view="saved" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span><span data-t="saved"></span><span class="badge" id="saved-badge" hidden></span></span></button>
</div></nav>

<script>
// Filled in by build.py from data/deals.json.
const DATA = {"updated":"2026-10-27","categories":["Flights","Hotels","Car rental","Travel extras","Activities","Shopping","Food & rides"],"sites":{"trip":{"name":"Trip.com","checked":"2026-10-27","note":"Most codes are tied to a payment card or region and are first come, first served. Hong Kong amounts are in HK$. Paste the code on the payment page.","color":["#2f6bff","#1c46d6"],"note_zh":"大部分優惠碼與付款卡或地區掛鈎，先到先得。香港金額以港幣計。在付款頁貼上優惠碼。","note_sc":"大部分优惠码与付款卡或地区挂钩，先到先得。香港金额以港币计。在付款页贴上优惠码。"},"sbc":{"name":"Sicily by Car","checked":"2026-10-27","note":"No open public promo right now. Every valid code is for a group, and the counter asks for proof at pickup. Without it they charge full price or can refuse the car. You need a credit card in the driver's name. A Black Friday code usually appears in late November.","color":["#d97706","#a85a03"],"note_zh":"現時沒有公開優惠。所有有效優惠碼都屬特定團體，取車時櫃枱會要求證明，否則會收原價或拒絕租車。須有主司機名下的信用卡。黑色星期五優惠碼通常在 11 月下旬推出。","note_sc":"现时没有公开优惠。所有有效优惠码都属特定团体，取车时柜台会要求证明，否则会收原价或拒绝租车。须有主司机名下的信用卡。黑色星期五优惠码通常在 11 月下旬推出。"},"europcar":{"name":"Europcar","checked":"2026-10-27","note":"Current discounts are built-in offers: book through the offer page, no code to type. The two Italy offers can't be stacked, so compare both for your dates. You need a credit card in the main driver's name.","color":["#16a34a","#0f7a37"],"note_zh":"現時的折扣都是內置優惠：經優惠頁預訂，不用輸入優惠碼。兩個意大利優惠不能疊加，按你的日期比較兩者。須有主司機名下的信用卡。","note_sc":"现时的折扣都是内置优惠：经优惠页预订，不用输入优惠码。两个意大利优惠不能叠加，按你的日期比较两者。须有主司机名下的信用卡。"},"klook":{"name":"Klook","checked":"2026-10-27","note":"Hong Kong codes are listed in HK$ and most have a minimum spend and a quota, so popular ones run out early. Many need a specific card or wallet (Mastercard, UnionPay, PayMe, AlipayHK, Octopus). Enter the code on the payment page; one code per order.","color":["#ff7a1a","#e2540a"],"note_zh":"香港優惠碼以港幣列出，大多有最低消費及名額，熱門的很快用完。很多須用指定信用卡或電子錢包（Mastercard、銀聯、PayMe、AlipayHK、八達通）。在付款頁輸入優惠碼，每張訂單限用一個。","note_sc":"香港优惠码以港币列出，大多有最低消费及名额，热门的很快用完。很多须用指定信用卡或电子钱包（Mastercard、银联、PayMe、AlipayHK、八达通）。在付款页输入优惠码，每张订单限用一个。"},"hotelscom":{"name":"Hotels.com","checked":"2026-10-27","note":"The 8% codes work on the Hong Kong site with a card issued in Hong Kong. One room per booking, and not with \"Pay at hotel\". Some codes only work through the bank's own Hotels.com link.","color":["#e0314b","#b01f37"],"note_zh":"92 折優惠碼適用於香港網站及香港發出的信用卡。每次預訂一間房，不適用於「到店付款」。部分優惠碼只能經銀行專屬的 Hotels.com 連結使用。","note_sc":"92 折优惠码适用于香港网站及香港发出的信用卡。每次预订一间房，不适用于「到店付款」。部分优惠码只能经银行专属的 Hotels.com 连结使用。"},"expedia":{"name":"Expedia","checked":"2026-10-27","note":"Bank codes work only on the bank's own Expedia Hong Kong page (for example expedia.com.hk/amex), for prepaid hotel-only bookings. Packages and pay-at-hotel rates don't qualify. Type the code in \"Enter voucher code\" at payment.","color":["#1f3a8a","#132559"],"note_zh":"銀行優惠碼只適用於銀行專屬的 Expedia 香港頁面（例如 expedia.com.hk/amex），只限預付純酒店預訂。套票及到店付款不適用。在付款時「輸入優惠碼」一欄輸入。","note_sc":"银行优惠码只适用于银行专属的 Expedia 香港页面（例如 expedia.com.hk/amex），只限预付纯酒店预订。套票及到店付款不适用。在付款时「输入优惠码」一栏输入。"},"agoda":{"name":"Agoda","checked":"2026-10-27","note":"Most Agoda savings are claim-link deals and card pages, not codes. Codes take a percentage off the room rate only (not taxes), and the real saving is often smaller than the headline.","color":["#7c3aed","#5420b8"],"note_zh":"Agoda 的優惠大多是領取連結及信用卡專頁，而非優惠碼。優惠碼只減房價百分比（不包稅項），實際省下的通常比標題少。","note_sc":"Agoda 的优惠大多是领取连结及信用卡专页，而非优惠码。优惠码只减房价百分比（不包税项），实际省下的通常比标题少。"},"booking":{"name":"Booking.com","checked":"2026-10-27","note":"Booking.com almost never uses public promo codes. Sign in to get Genius prices (10–20% off at properties with the blue Genius label) and look for Getaway or Late Escape deals. Codes on coupon sites are usually fake or partner-only.","color":["#1556c9","#0b3a8f"],"note_zh":"Booking.com 幾乎從不使用公開優惠碼。登入後可享 Genius 價（有藍色 Genius 標籤的住宿 8 至 9 折），並留意 Getaway 或 Late Escape 優惠。優惠網站上的優惠碼通常是假的或只限合作夥伴。","note_sc":"Booking.com 几乎从不使用公开优惠码。登入后可享 Genius 价（有蓝色 Genius 标签的住宿 8 至 9 折），并留意 Getaway 或 Late Escape 优惠。优惠网站上的优惠码通常是假的或只限合作伙伴。"},"skyscanner":{"name":"Skyscanner","checked":"2026-10-27","note":"Skyscanner is a price comparison site, not a seller, so it has no promo codes. You book on the airline or agent site it sends you to (Trip.com, Opodo, Kiwi.com, the airline). Apply codes for that site instead. The same goes for Kayak and Google Flights.","color":["#0b7ad1","#075a9c"],"note_zh":"Skyscanner 是比價網站，不是賣家，所以沒有優惠碼。你會在它轉介的航空公司或代理網站預訂（Trip.com、Opodo、Kiwi.com、航空公司），改用該網站的優惠碼。Kayak 及 Google Flights 亦一樣。","note_sc":"Skyscanner 是比价网站，不是卖家，所以没有优惠码。你会在它转介的航空公司或代理网站预订（Trip.com、Opodo、Kiwi.com、航空公司），改用该网站的优惠码。Kayak 及 Google Flights 亦一样。"},"kiwi":{"name":"Kiwi.com","checked":"2026-10-27","note":"Kiwi.com codes on coupon sites are mostly old. One code per booking. Check the price drops before you pay.","color":["#00a69c","#007a73"],"note_zh":"優惠網站上的 Kiwi.com 優惠碼大多已舊。每次預訂限用一個。付款前檢查價格有否下降。","note_sc":"优惠网站上的 Kiwi.com 优惠码大多已旧。每次预订限用一个。付款前检查价格有否下降。"},"opodo":{"name":"Opodo / eDreams","checked":"2026-10-27","note":"Opodo and eDreams push their paid Prime membership for discounts. Coupon-site codes hide the code text and many are old Black Friday codes. App-only offers come and go.","color":["#c2185b","#8e0f41"],"note_zh":"Opodo 及 eDreams 主力推銷付費 Prime 會員折扣。優惠網站隱藏優惠碼文字，很多是舊的黑色星期五優惠碼。App 專屬優惠時有時無。","note_sc":"Opodo 及 eDreams 主力推销付费 Prime 会员折扣。优惠网站隐藏优惠码文字，很多是旧的黑色星期五优惠码。App 专属优惠时有时无。"},"avis":{"name":"Avis","checked":"2026-10-27","note":"Avis uses AWD numbers (company or club rates) and coupon codes. Public savings come from the free Avis Preferred programme and offers on the Avis deals page. Only use an AWD number you're entitled to; the counter can check.","color":["#dc2626","#a51b1b"],"note_zh":"Avis 使用 AWD 編號（公司或會所價）及優惠券碼。公開優惠來自免費的 Avis Preferred 計劃及 Avis 優惠頁。只使用你有資格的 AWD 編號，櫃枱可以查核。","note_sc":"Avis 使用 AWD 编号（公司或会所价）及优惠券码。公开优惠来自免费的 Avis Preferred 计划及 Avis 优惠页。只使用你有资格的 AWD 编号，柜台可以查核。"},"hertz":{"name":"Hertz","checked":"2026-10-27","note":"Hertz discounts use a CDP code (from an employer, club or card) plus an optional PC promotional code. Using a CDP you're not entitled to can get the rental repriced at the counter.","color":["#facc15","#d4a90b","#1a1600"],"note_zh":"Hertz 折扣使用 CDP 碼（來自僱主、會所或信用卡）加可選的 PC 推廣碼。使用不合資格的 CDP，櫃枱可能重新計價。","note_sc":"Hertz 折扣使用 CDP 码（来自雇主、会所或信用卡）加可选的 PC 推广码。使用不合资格的 CDP，柜台可能重新计价。"},"sixt":{"name":"Sixt","checked":"2026-10-27","note":"Sixt has few public rental codes. Most shared codes are for its chauffeur and ride service. Check the Sixt offers page for your country.","color":["#f97316","#c75a0c"],"note_zh":"Sixt 公開租車優惠碼很少。大部分流傳的優惠碼是專車服務用的。查看你所在國家的 Sixt 優惠頁。","note_sc":"Sixt 公开租车优惠码很少。大部分流传的优惠码是专车服务用的。查看你所在国家的 Sixt 优惠页。"},"rentalcars":{"name":"Rentalcars.com","checked":"2026-10-27","note":"Rentalcars.com rarely accepts codes. Coupon-site codes were last seen working in 2022. Card and airline partner links are the reliable way to get a discount.","color":["#2563eb","#1846b3"],"note_zh":"Rentalcars.com 很少接受優惠碼。優惠網站的優惠碼最後一次有效是 2022 年。信用卡及航空公司合作連結才是可靠的折扣途徑。","note_sc":"Rentalcars.com 很少接受优惠码。优惠网站的优惠码最后一次有效是 2022 年。信用卡及航空公司合作连结才是可靠的折扣途径。"},"discovercars":{"name":"Discover Cars","checked":"2026-10-27","note":"One code per booking, not combined with other promotions, and usually not on prepaid partner packages from Hertz or Europcar.","color":["#0ea5e9","#0a7fb4"],"note_zh":"每次預訂限用一個優惠碼，不可與其他推廣同用，通常不適用於 Hertz 或 Europcar 的預付套票。","note_sc":"每次预订限用一个优惠码，不可与其他推广同用，通常不适用于 Hertz 或 Europcar 的预付套票。"},"iherb":{"name":"iHerb","checked":"2026-10-27","note":"One code per order. HK codes need a Hong Kong delivery address and often an account limit. Codes take money off the product total, not shipping.","color":["#4caf50","#2f8a34"],"note_zh":"每張訂單限用一個優惠碼。香港優惠碼須用香港送貨地址，通常有帳戶限制。優惠碼只減貨品總額，不減運費。","note_sc":"每张订单限用一个优惠码。香港优惠码须用香港送货地址，通常有账户限制。优惠码只减货品总额，不减运费。"},"hktvmall":{"name":"HKTVmall","checked":"2026-10-27","note":"Most codes are for specific categories (beauty, baby, appliances) and only count spend on those items. VIP members get 5% on Wednesdays and Citi HKTVmall cardholders 5% on Thursdays, with codes shown in the app.","color":["#00a0e9","#0077b0"],"note_zh":"大部分優惠碼只適用於指定類別（美容、嬰兒、電器），只計算該類貨品的消費。VIP 會員逢星期三 95 折，Citi HKTVmall 信用卡逢星期四 95 折，優惠碼在 App 內顯示。","note_sc":"大部分优惠码只适用于指定类别（美容、婴儿、电器），只计算该类货品的消费。VIP 会员逢星期三 95 折，Citi HKTVmall 信用卡逢星期四 95 折，优惠码在 App 内显示。"},"taobao":{"name":"Taobao","checked":"2026-10-27","note":"Codes are in RMB (¥) and first come, first served, especially during Double 11 (20 Oct to 13 Nov 2026). Payment method matters: AlipayHK and PayMe have their own codes, and a normal HK credit card adds about 5% in fees.","color":["#ff5000","#d13f00"],"note_zh":"優惠碼以人民幣（¥）計，先到先得，雙 11 期間（2026 年 10 月 20 日至 11 月 13 日）尤其如此。付款方式有影響：AlipayHK 及 PayMe 有各自的優惠碼，一般香港信用卡會多收約 5% 手續費。","note_sc":"优惠码以人民币（¥）计，先到先得，双 11 期间（2026 年 10 月 20 日至 11 月 13 日）尤其如此。付款方式有影响：AlipayHK 及 PayMe 有各自的优惠码，一般香港信用卡会多收约 5% 手续费。"},"zalora":{"name":"Zalora","checked":"2026-10-27","note":"One code per order. Free delivery from HK$299. New members get a first-order discount after signing up to the newsletter.","color":["#2b2b33","#16161b"],"note_zh":"每張訂單限用一個優惠碼。滿 HK$299 免運費。新會員訂閱電子報後可享首單折扣。","note_sc":"每张订单限用一个优惠码。满 HK$299 免运费。新会员订阅电子报后可享首单折扣。"},"dyson":{"name":"Dyson","checked":"2026-10-27","note":"Codes work on selected products only on the Dyson Hong Kong online store.","color":["#6d28d9","#4c1a9e"],"note_zh":"優惠碼只適用於 Dyson 香港網店的指定產品。","note_sc":"优惠码只适用于 Dyson 香港网店的指定产品。"},"watsons":{"name":"Watsons","checked":"2026-10-27","note":"Watsons online codes are often free gifts with a minimum spend, not money off.","color":["#00a3a1","#007775"],"note_zh":"屈臣氏網店優惠碼通常是滿額送禮品，不是減價。","note_sc":"屈臣氏网店优惠码通常是满额送礼品，不是减价。"},"pns":{"name":"PARKnSHOP","checked":"2026-10-27","note":"Online store codes. Some only work with click & collect.","color":["#e11d48","#a8122f"],"note_zh":"網店優惠碼。部分只適用於店舖自取。","note_sc":"网店优惠码。部分只适用于店舖自取。"},"charleskeith":{"name":"Charles & Keith","checked":"2026-10-27","note":"First-purchase code on the Hong Kong online store.","color":[" /* ---------- Card colours ---------- */
const cardStyle = k => { const c = (SITES[k] && SITES[k].color) || ["#3a3a46", "#24242c"]; return `background:linear-gradient(135deg, ${c[0]}, ${c[1]});color:${c[2] || "#fff"}`; };
const siteColor = k => ((SITES[k] && SITES[k].color) || ["#5b7cff"])[0];

const RANK = { active: 0, restricted: 1, unconfirmed: 2, expired: 3, avoid: 4 };
const today = new Date(); today.setHours(0, 0, 0, 0);

// Work out each deal's live status from today's date, once at load.
DEALS.forEach((d, i) => {
  d.id = d.site + ":" + (d.codes ? d.codes.join("|") : d.title);
  d.kind = d.kind || "code";
  d.eff = d.status;
  d.daysLeft = null;
  if (d.expires) {
    d.daysLeft = Math.round((new Date(d.expires + "T00:00:00") - today) / 86400000);
    if (d.daysLeft < 0 && d.status !== "avoid") d.eff = "expired";
  }
  d.dead = d.eff === "expired" || d.eff === "avoid";
  d.order = i;
});

const store = {
  get(k, f) { try { const v = localStorage.getItem(k); return v == null ? f : JSON.parse(v); } catch { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let marks = store.get("pcw-marks", {});
const state = Object.assign({ cat: "all", dead: false, view: "wallet", open: null }, store.get("zsm-view", {}));
state.q = "";
if (state.cat !== "all" && !CATS.includes(state.cat)) state.cat = "all";
if (state.view !== "saved") state.view = "wallet";
const guessLang = () => { const l = (navigator.language || "").toLowerCase(); return /^zh-(cn|sg)|hans/.test(l) ? "hans" : l.startsWith("zh") ? "hant" : "en"; };
let lang = store.get("zsm-lang", null) || guessLang();
if (!T[lang]) lang = "en";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const L = () => T[lang];
// Pick the field in the current language, falling back to English.
const tx = (o, f) => lang === "en" ? o[f] : (o[f + "_" + (lang === "hans" ? "sc" : "zh")] || o[f + "_zh"] || o[f]);
const catName = c => L().cats[c] || c;
const fmt = d => new Date(d + "T00:00:00").toLocaleDateString(L().locale, { day: "numeric", month: "short", year: "numeric" });

function matches(d) {
  if (state.cat !== "all" && d.cat !== state.cat) return false;
  if (state.q) {
    const hay = [SITES[d.site].name, d.cat, catName(d.cat), d.title, d.desc, d.cond, tx(d, "title"), tx(d, "desc"), tx(d, "cond"), d.big, ...(d.codes || [])].join(" ").toLowerCase();
    return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  }
  return true;
}
const sortDeals = list => list.sort((a, b) => RANK[a.eff] - RANK[b.eff] || (marks[a.id] === "no") - (marks[b.id] === "no") || a.order - b.order);

/* ---------- Static text ---------- */
function renderText() {
  document.documentElement.lang = lang === "en" ? "en" : lang === "hans" ? "zh-Hans" : "zh-Hant-HK";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = L()[el.dataset.t]; });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#foot").textContent = L().foot(fmt(DATA.updated));
}

/* ---------- Wallet ---------- */
function renderStats() {
  const usable = DEALS.filter(d => !d.dead);
  const soon = usable.filter(d => d.daysLeft != null && d.daysLeft <= 14).length;
  $("#stats").innerHTML = `<span><b class="num">${usable.length}</b>${L().live}</span><span><b class="num">${Object.keys(SITES).length}</b>${L().sites}</span><span><b class="num">${soon}</b>${L().soon}</span>`;
  const worked = Object.values(marks).filter(v => v === "yes").length;
  const badge = $("#saved-badge"); badge.hidden = !worked; badge.textContent = worked;
}

function renderCats() {
  const live = DEALS.filter(d => !d.dead);
  $("#cats").innerHTML = ["all", ...CATS].map(c => {
    const n = c === "all" ? live.length : live.filter(d => d.cat === c).length;
    return `<button class="chip" data-cat="${esc(c)}" aria-pressed="${state.cat === c}">${c === "all" ? L().all : esc(catName(c))}<span class="n">${n}</span></button>`;
  }).join("");
  $("#showDead").checked = state.dead;
}

function dealHtml(d, withSite) {
  const t = L();
  const tags = [`<span class="tag t-${d.eff}">${t.status[d.eff]}</span>`];
  if (d.found === "auto" && !d.dead) tags.push(`<span class="tag t-auto">${t.auto}</span>`);
  if (d.kind === "offer" && !d.dead) tags.push(`<span class="tag t-offer">${t.noCode}</span>`);
  if (!d.dead && d.daysLeft != null && d.daysLeft <= 14) tags.push(`<span class="tag t-soon">${d.daysLeft === 0 ? t.endsToday : t.daysLeft(d.daysLeft)}</span>`);
  let action = "";
  if (d.codes) action = `<div class="codes">${d.codes.map(c => `<button class="code" data-code="${esc(c)}" ${d.dead ? "disabled" : ""} aria-label="${t.copy} ${esc(c)}">${esc(c)}<span class="cp">${t.copy}</span></button>`).join("")}</div>`;
  else if (d.src && !d.dead) action = `<a class="offer-link" href="${esc(d.src)}" target="_blank" rel="noopener">${t.open}</a>`;
  const exp = d.expires ? (d.daysLeft < 0 ? t.ended(fmt(d.expires)) : t.until(fmt(d.expires))) : t.noEnd;
  const m = marks[d.id];
  const src = d.src && (d.codes || d.dead) ? `<a href="${esc(d.src)}" target="_blank" rel="noopener">${t.source}</a>` : "";
  return `<article class="deal ${d.dead ? "dead" : ""}" style="--site:${siteColor(d.site)}">
    ${withSite ? `<span class="saved-site">${esc(SITES[d.site].name)}</span>` : ""}
    <div class="deal-top"><span class="deal-big">${esc(tx(d, "big"))}</span><div class="tags">${tags.join("")}</div><span class="deal-title">${esc(tx(d, "title"))}</span></div>
    <p class="desc">${esc(tx(d, "desc"))}</p>
    <p class="cond">${esc(tx(d, "cond"))}</p>
    ${action}
    <div class="meta"><span>${exp}</span>${src}
      ${d.dead ? "" : `<span class="mine" role="group">
        <button class="yes" data-mark="${esc(d.id)}" data-v="yes" aria-pressed="${m === "yes"}">${t.worked}</button>
        <button class="no" data-mark="${esc(d.id)}" data-v="no" aria-pressed="${m === "no"}">${t.didnt}</button></span>`}</div>
  </article>`;
}

function renderStack() {

        <div class="site-tip"><b>${t.how}</b> ${esc(tx(SITES[s.k], "note"))}</div>
        ${s.live.map(d => dealHtml(d)).join("")}
        ${state.dead && dead.length ? `<div class="dead-h">${t.deadH}</div>${dead.map(d => dealHtml(d)).join("")}` : ""}
        ${!s.live.length && !state.dead ? `<p class="empty">${t.noLive}</p>` : ""}
      </div>`;
    }
    return `<div class="wcard ${open ? "open" : ""}" style="${cardStyle(s.k)}">
      <button class="wcard-h" data-site="${s.k}" aria-expanded="${open}">
        <span class="wcard-name">${esc(SITES[s.k].name)}</span>
        <span class="wcard-right"><span class="wcard-best">${s.top ? esc(tx(s.top, "big")) : "—"}</span><br><span class="wcard-count">${t.code(s.live.length)}</span></span>
        <span class="wcard-cats">${esc(cats)}</span>
      </button>${body}</div>`;
  }).join("");
}

/* ---------- Saved ---------- */
function renderSaved() {
  const t = L();
  const worked = sortDeals(DEALS.filter(d => marks[d.id] === "yes" && !d.dead));
  const soon = sortDeals(DEALS.filter(d => !d.dead && d.daysLeft != null && d.daysLeft <= 7 && d.eff === "active" && marks[d.id] !== "yes"));
  $("#saved").innerHTML =
    `<div class="section-h">${t.workedH}</div>` +
    (worked.length ? `<div class="saved-list">${worked.map(d => dealHtml(d, true)).join("")}</div>` : `<p class="empty" style="padding:20px 0">${esc(t.workedE)}</p>`) +
    `<div class="section-h">${t.weekH}</div>` +
    (soon.length ? `<div class="saved-list">${soon.map(d => dealHtml(d, true)).join("")}</div>` : `<p class="empty" style="padding:20px 0">${t.weekE}</p>`);
}

function render() {
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === state.view));
  $("#view-wallet").hidden = state.view !== "wallet";
  $("#view-saved").hidden = state.view !== "saved";
  renderText(); renderStats(); renderCats(); renderStack(); renderSaved();
  store.set("zsm-view", { cat: state.cat, dead: state.dead, view: state.view, open: state.open });
}

/* ---------- Toasts ---------- */
const TOAST_ICONS = { ok: '<path d="M20 6 9 17l-5-5"/>', warn: '<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>' };
function toast(msg, level = "ok") {
  const el = document.createElement("div");
  el.className = "toast " + level;
  el.innerHTML = `<svg viewBox="0 0 24 24">${TOAST_ICONS[level]}</svg><div>${esc(msg)}</div>`;
  const box = $("#toasts"); box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 220); }, 2600);
}
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el.firstChild); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const t = L();
  if (b.dataset.lang) { lang = b.dataset.lang; store.set("zsm-lang", lang); render(); }
  else if (b.dataset.view) { state.view = b.dataset.view; render(); window.scrollTo({ top: 0 }); }
  else if (b.dataset.cat) { state.cat = b.dataset.cat; state.open = null; render(); }
  else if (b.dataset.site) {
    state.open = state.open === b.dataset.site ? null : b.dataset.site;
    renderStack(); store.set("zsm-view", { cat: state.cat, dead: state.dead, view: state.view, open: state.open });
    if (state.open) { const el = document.querySelector(`[data-site="${state.open}"]`); el && el.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
  }
  else if (b.dataset.code) {
    const code = b.dataset.code;
    const done = () => { b.classList.add("done"); b.querySelector(".cp").textContent = t.copied; toast(t.copiedT(code)); setTimeout(() => { b.classList.remove("done"); b.querySelector(".cp").textContent = L().copy; }, 1600); };
    try { navigator.clipboard.writeText(code).then(done, () => { selectText(b); toast(t.selectT, "warn"); }); }
    catch { selectText(b); toast(t.selectT, "warn"); }
  }
  else if (b.dataset.mark) {
    const id = b.dataset.mark, v = b.dataset.v;
    if (marks[id] === v) delete marks[id]; else marks[id] = v;
    store.set("pcw-marks", marks);
    renderStats(); renderStack(); renderSaved();
    toast(marks[id] ? (v === "yes" ? t.wT : t.nT) : t.cT, marks[id] === "no" ? "warn" : "ok");
  }
});
$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); renderStack(); });
$("#showDead").addEventListener("change", e => { state.dead = e.target.checked; render(); });

render();
</script>
</body>
</html>
